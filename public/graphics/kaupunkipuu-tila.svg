    .below-a {
      fill: none;
      stroke: #cbd0cb;
      stroke-width: 0.66;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      opacity: 0.5;
    }

    .below-b {
      fill: none;
      stroke: #d5d9d5;
      stroke-width: 0.58;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      opacity: 0.42;
    }

    .datum {
      fill: none;
      stroke: #899389;
      stroke-width: 0.76;
      stroke-linecap: round;
      stroke-dasharray: 0.8 10;
      vector-effect: non-scaling-stroke;
      opacity: 0.52;
    }
  </style>

