      "
    />
  </g>


  <!-- =====================================================
       PUU
       ===================================================== -->

  <!--
    Puu sijaitsee hieman painauman vasemmalla puolella.

    Latvusta ei suljeta yhdeksi ikoniksi.
    Se syntyy neljästä avoimesta piirrosvedosta.
