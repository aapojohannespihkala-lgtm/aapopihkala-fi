  <title id="title">Kaupunkipuu tarvitsee tilansa</title>

  <desc id="desc">
    Herkkä maisema-arkkitehtoninen kaavio, jossa pitkä kaupunkirakenteen linja
    väistää olemassa olevaa puuta. Puun ympärillä näkyy hyvin vaaleita,
    epäsäännöllisiä maasto- ja tilakäyriä.
  </desc>

