<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 400"
  fill="none"
  role="img"
  aria-labelledby="title desc"
  preserveAspectRatio="xMidYMid meet"
>
  <title id="title">Kaupunkipuu tarvitsee tilansa</title>

  <desc id="desc">
    Herkkä maisema-arkkitehtoninen viivapiirros, jossa pitkä kaupunkirakenteen
    linja väistää olemassa olevaa puuta. Puun ympärillä kulkee vaaleita,
    epäsäännöllisiä maasto- ja tilaviivoja.
  </desc>

  <style>
    .ground {
      fill: none;
      stroke: #59635a;
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .tree {
      fill: none;
      stroke: #59635a;
      stroke-width: 1.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .contour-a {
      fill: none;
      stroke: #cdd2cd;
      stroke-width: 0.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      opacity: 0.58;
    }

    .contour-b {
      fill: none;
      stroke: #d5d9d5;
      stroke-width: 0.62;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      opacity: 0.52;
    }

    .contour-c {
      fill: none;
      stroke: #dde0dd;
      stroke-width: 0.58;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      opacity: 0.46;
