name: Current live data smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: current-live-data-smoke
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live Current portfolio data
        shell: bash
        run: |
          set -euo pipefail

          url="https://aapopihkala.fi/api/current/markets?portfolio=1&live_smoke=${GITHUB_RUN_ID}"

          for attempt in $(seq 1 18); do
            echo "Current portfolio attempt ${attempt}/18"

            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 30 \
              --header 'Accept: application/json' \
              --header 'Cache-Control: no-cache' \
              "$url" \
              --output current2-live.json; then
              if node <<'NODE'
          const fs = require('node:fs');

          const body = JSON.parse(fs.readFileSync('current2-live.json', 'utf8'));
          const periods = ['today', 'week1', 'month1', 'month3', 'month6', 'ytd', 'year1', 'year3', 'year5'];
          const items = Array.isArray(body.items) ? body.items : [];
          const unavailable = Array.isArray(body.unavailable) ? body.unavailable : [];
          const byId = new Map(items.map((item) => [item.id, item]));
          const failures = [];

          if (items.length !== 19) failures.push(`expected 19 items, got ${items.length}`);
          if (body.expected !== 19) failures.push(`expected response.expected=19, got ${String(body.expected)}`);
          if (unavailable.length > 0) failures.push(`unavailable: ${unavailable.join(', ')}`);

          for (const period of periods) {
            const missing = items
              .filter((item) => item?.changes?.[period] === null || item?.changes?.[period] === undefined)
              .map((item) => item.id);
            console.log(`${period}: ${items.length - missing.length}/19 data${missing.length ? ` | missing ${missing.join(', ')}` : ''}`);
          }

          const requirePeriods = (id, requiredPeriods) => {
            const item = byId.get(id);
            if (!item) {
              failures.push(`${id}: row missing`);
              return;
            }

            const missing = requiredPeriods.filter(
              (period) => item?.changes?.[period] === null || item?.changes?.[period] === undefined,
            );
            if (missing.length > 0) failures.push(`${id}: missing ${missing.join(', ')}`);
          };

          const fullNordnetPeriods = periods;
          for (const id of [
            'handelsbanken-usa',
            'nordnet-finland',
            'nordnet-sweden',
            'spiltan-investmentbolag',
            'storebrand-japan',
          ]) {
            requirePeriods(id, fullNordnetPeriods);
          }

          const opIndexPeriods = periods;
          for (const id of ['op-asia-index-a', 'op-europe-index-a', 'op-world-index-a']) {
            requirePeriods(id, opIndexPeriods);
          }

          const opForestPeriods = ['month3', 'month6', 'ytd', 'year1', 'year3', 'year5'];
          requirePeriods('op-forest-owner-b', opForestPeriods);

          if (failures.length > 0) {
            console.error(`Current portfolio data incomplete: ${failures.join(' | ')}`);
            process.exit(1);
          }

          console.log(`Current live portfolio verified: ${items.length}/19 rows, no unavailable sources.`);
          NODE
              then
                exit 0
              fi
            fi

            if [[ "$attempt" -lt 18 ]]; then
              sleep 10
            fi
          done

          echo "Current portfolio data did not reach the required coverage." >&2
          if [[ -f current2-live.json ]]; then
            cat current2-live.json >&2
          fi
          exit 1

      - name: Verify live Current market macro feed
        shell: bash
        run: |
          set -euo pipefail

          url="https://aapopihkala.fi/api/current/markets?live_smoke=${GITHUB_RUN_ID}"

          for attempt in $(seq 1 18); do
            echo "Current market macro attempt ${attempt}/18"

            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 30 \
              --header 'Accept: application/json' \
              --header 'Cache-Control: no-cache' \
              "$url" \
              --output current-market-live.json; then
              if node <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('current-market-live.json', 'utf8'));
          const items = Array.isArray(body.items) ? body.items : [];
          const series = Array.isArray(body.series) ? body.series : [];
          const euribor = items.find((item) => item?.id === 'euribor-3m');
          const seriesIds = new Set(series.map((item) => item?.id));
          const failures = [];

          if (!euribor || typeof euribor.value !== 'number' || !Number.isFinite(euribor.value)) {
            failures.push('3M Euribor item missing or invalid');
          }
          if (!euribor?.observedAt) failures.push('3M Euribor observation date missing');
          if (!seriesIds.has('euribor-3m')) failures.push('Euribor 1Y series missing');
          if (!seriesIds.has('world')) failures.push('World 1Y series missing');

          if (failures.length > 0) {
            console.error(`Current market macro feed incomplete: ${failures.join(' | ')}`);
            process.exit(1);
          }

          console.log(`Current market feed verified: Euribor ${euribor.value} on ${euribor.observedAt}; series ${[...seriesIds].join(', ')}.`);
          NODE
              then
                exit 0
              fi
            fi

            if [[ "$attempt" -lt 18 ]]; then
              sleep 10
            fi
          done

          echo "Current market macro feed did not recover in production." >&2
          if [[ -f current-market-live.json ]]; then
            cat current-market-live.json >&2
          fi
          exit 1

      - name: Verify live Current Liiga feed
        shell: bash
        run: |
          set -euo pipefail

          url="https://aapopihkala.fi/api/current/liiga?live_smoke=${GITHUB_RUN_ID}"

          for attempt in $(seq 1 18); do
            echo "Current Liiga attempt ${attempt}/18"

            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 30 \
              --header 'Accept: application/json' \
              --header 'Cache-Control: no-cache' \
              "$url" \
              --output current-liiga-live.json; then
              if node <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('current-liiga-live.json', 'utf8'));
          const standings = Array.isArray(body.standings) ? body.standings : [];
          const failures = [];
          const ids = standings.map((team) => team?.id).filter((id) => typeof id === 'string');
          const ranks = standings.map((team) => team?.rank).filter((rank) => Number.isFinite(rank));
          const ilves = standings.find((team) => team?.id === 'ilves');
          const ilvesStanding = body.ilvesStanding;
          const ilvesGames = [body.lastIlvesGame, body.nextIlvesGame, body.liveIlvesGame]
            .filter(Boolean);

          if (!Number.isFinite(body.season)) failures.push(`invalid season: ${String(body.season)}`);
          if (body.source !== 'Liiga') failures.push(`invalid source: ${String(body.source)}`);
          if (!['/api/v2/games', '/api/v2/schedule'].includes(body.upstream)) {
            failures.push(`unexpected upstream: ${String(body.upstream)}`);
          }
          if (standings.length !== 17) failures.push(`expected 17 standings rows, got ${standings.length}`);
          if (new Set(ids).size !== 17) failures.push(`expected 17 unique team ids, got ${new Set(ids).size}`);
          if (new Set(ranks).size !== 17 || ranks.some((rank) => rank < 1 || rank > 17)) {
            failures.push('standings ranks are missing, duplicated or out of range');
          }
          if (standings.some((team) =>
            !team ||
            !Number.isFinite(team.games) || team.games < 0 ||
            !Number.isFinite(team.wins) || team.wins < 0 ||
            !Number.isFinite(team.ties) || team.ties < 0 ||
            !Number.isFinite(team.losses) || team.losses < 0 ||
            !Number.isFinite(team.points) || team.points < 0 ||
            !Number.isFinite(team.goalDifference)
          )) {
            failures.push('standings contain invalid numeric values');
          }
          if (!ilves) {
            failures.push('Ilves row missing');
          } else if (
            !ilvesStanding ||
            ilvesStanding.totalTeams !== 17 ||
            ilvesStanding.rank !== ilves.rank ||
            ilvesStanding.games !== ilves.games ||
            ilvesStanding.points !== ilves.points
          ) {
            failures.push('Ilves standing summary does not match standings row');
          }

          for (const game of ilvesGames) {
            if (game.homeTeamId !== 'ilves' && game.awayTeamId !== 'ilves') {
              failures.push(`Ilves game summary does not contain Ilves: ${String(game.id)}`);
            }
            if (!game.start || !Number.isFinite(Date.parse(game.start))) {
              failures.push(`Ilves game summary has invalid start: ${String(game.id)}`);
            }
          }

          if (body.lastIlvesGame && (!ilves || ilves.games < 1)) {
            failures.push('completed Ilves game exists but standings still show zero games');
          }
          if (standings.every((team) => team?.games === 0) && ilvesGames.length === 0) {
            failures.push('standings and Ilves game summaries are both empty');
          }

          if (failures.length > 0) {
            console.error(`Current Liiga feed incomplete: ${failures.join(' | ')}`);
            process.exit(1);
          }

          console.log(`Current Liiga verified: season ${body.season}, ${standings.length} valid rows via ${body.upstream}.`);
          NODE
              then
                exit 0
              fi
            fi

            if [[ "$attempt" -lt 18 ]]; then
              sleep 10
            fi
          done

          echo "Current Liiga feed did not recover in production." >&2
          if [[ -f current-liiga-live.json ]]; then
            cat current-liiga-live.json >&2
          fi
          exit 1
