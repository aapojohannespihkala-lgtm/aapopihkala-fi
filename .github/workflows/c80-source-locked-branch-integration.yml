# Temporary source-locked C80 integration job; never writes main or publishes GLBs.
name: C80 source-locked branch integration
on:
  push:
    branches:
      - c80/high6-g1-visibility-final-20261028
permissions:
  contents: write
  id-token: write
jobs:
  stage-c80:
    if: "${{ github.repository == 'aapojohannespihkala-lgtm/aapopihkala-fi' && github.event.head_commit.message == 'chore(d-view): stage verified C80 one-pass integration' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Authorize read-only Drive source downloads
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GDRIVE_WIF_PROVIDER }}
          service_account: ${{ vars.GDRIVE_PUBLISHER_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          create_credentials_file: false
      - name: Download and verify exactly five immutable input ZIPs
        env:
          GDRIVE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, urllib.request, zipfile
          root=pathlib.Path('/tmp/c80-immutable-inputs')
          root.mkdir(parents=True,exist_ok=True)
          required={
            'final':('1zwDErel6ubAF5R7tw1TBqE78WQC9wz78','662efb6ac0bf7a7be340d9cfae4207d3d880afd7781237d52b5c4935c7dc9328'),
            'joint':('1BZkb--G7aw8RJO0lpTBOUnpbWRX44CWQ','20ff193835feebd050ceb815420c0d2eec968e395685075b9b8b60a5ce811ceb'),
            'high6':('1xovK8ASjbRvDgWmIn7j_OV2VBDdMyWXB','1fb7492706cffe1cccb8930b52880eda6756fb94b87b594098530fdfbdb97601'),
            'composer':('1zE13AJu1y_dEe_UTN736Gm11uBHevmXY','acc70699d871ae23be4853595b1eb13a767d4ea1780115bfc89a3ee4d360fbe1'),
            'g1':('12NnK_R-g6tf5L5JzL2xlLdJhgLcCcRQa','6a9bab4b0190a8ee0d1130e20811ff66c6fcba4c13911d54336365ef5e2fd561')}
          token=os.environ['GDRIVE_ACCESS_TOKEN']
          for name,(id,want) in required.items():
            req=urllib.request.Request('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media&supportsAllDrives=true',headers={'Authorization':'Bearer '+token})
            with urllib.request.urlopen(req,timeout=60) as response: data=response.read()
            if hashlib.sha256(data).hexdigest()!=want:raise RuntimeError('FAIL_CLOSED_SHA '+name)
            dest=root/(name+'.zip');dest.write_bytes(data)
            with zipfile.ZipFile(dest) as z:
              if z.testzip():raise RuntimeError('FAIL_CLOSED_ZIP_CRC '+name)
          with zipfile.ZipFile(root/'final.zip') as z:
            z.extract('apply_joint_high6.py',root)
          print('IMMUTABLE_SOURCE_ZIPS_5_OF_5_PASS')
          PY
      - name: Apply released installer to exact clean main in detached worktree
        run: |
          set -euo pipefail
          mainsha=a0aa685524bc859482d70ca1964e9142e39db3fe
          test "$(git rev-parse HEAD^)" = "$mainsha"
          git worktree add --detach /tmp/c80-main-exact "$mainsha"
          args=(--repo /tmp/c80-main-exact --joint-zip /tmp/c80-immutable-inputs/joint.zip --high6-zip /tmp/c80-immutable-inputs/high6.zip --composer-zip /tmp/c80-immutable-inputs/composer.zip --g1-zip /tmp/c80-immutable-inputs/g1.zip)
          python3 /tmp/c80-immutable-inputs/apply_joint_high6.py "${args[@]}" --check
          python3 /tmp/c80-immutable-inputs/apply_joint_high6.py "${args[@]}" --apply
          cp /tmp/c80-main-exact/src/pages/private-model/index.astro src/pages/private-model/index.astro
          for source in /tmp/c80-main-exact/src/scripts/c80*.mjs; do
            file="${source##*/}"
            if [[ "$file" == c80_* || "$file" == c80F* || "$file" == c80R* || "$file" == c80V* ]]; then
              test ! -e "src/scripts/$file"
              cp "$source" "src/scripts/$file"
            fi
          done
          test -f src/scripts/c80_k17_visibility_policy.mjs
          test -f src/scripts/c80_g1_side_context_overlay.mjs
          test -f src/scripts/c80VisibilityComposer.mjs
          git diff --check
          echo "C80_LOCAL_INSTALL_PASS"
      - name: Install dependencies and validate TypeScript
        run: |
          npm ci
          npm run check
      - name: Build changed viewer
        run: npm run build
      - name: Commit verified C80-only changes to feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "c80/high6-g1-visibility-final-20261028"
          test "$(git rev-parse HEAD^)" = a0aa685524bc859482d70ca1964e9142e39db3fe
          git add src/pages/private-model/index.astro src/scripts/c80_k17_viewer_bridge_adapter.mjs src/scripts/c80_k17_visibility_policy.mjs src/scripts/c80FloorShellFocus.mjs src/scripts/c80RoofVisibility.mjs src/scripts/c80VisibilityComposer.mjs src/scripts/c80_g1_main_view_adapter.mjs src/scripts/c80_g1_side_context_overlay.mjs
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 8
          git -c user.name='Ylisrinne C80 integration' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(d-view): integrate verified C80 K17 roof shell G1 HIGH6 source policies'
          git push origin HEAD:c80/high6-g1-visibility-final-20261028
          echo "C80_BRANCH_ONLY_COMMIT_PASS_NO_MERGE"
