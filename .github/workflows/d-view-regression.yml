            --output "$file" \
            "https://aapopihkala.fi/private-model/work-test/verify/ylisrinne-v69p12r1-sink-faucet-floor-metadata-20261105.glb"
          python3 - "$file" <<'PY'
          import hashlib, json, pathlib, struct, sys
          data = pathlib.Path(sys.argv[1]).read_bytes()
          assert len(data) == 32610084
          assert hashlib.sha256(data).hexdigest() == 'd39102890470f59d7c2a2e033851a6f3d1481a83fb6180b549acd4cbf22182b3'
          source = json.loads(data[20:20 + struct.unpack_from('<I', data, 12)[0]])
          assert len(source['scenes']) == 295 and source['scene'] == 292
          extras = source['asset']['extras']
          assert extras['current'] is False and extras['asBuilt'] is False
          assert extras['viewerFloorScenes'] == {'1F': 290, '2F': 293, 'BOTH': 294}
          def nodes(scene):
              found = set()
              def walk(index):
                  found.add(index)
                  for child in source['nodes'][index].get('children', []): walk(child)
              for root in source['scenes'][scene]['nodes']: walk(root)
              return found
          for scene in (293, 294):
              assert {8028, 8030}.issubset(nodes(scene))
          for index, mesh in ((8028, 2461), (8030, 2462)):
              assert source['nodes'][index]['mesh'] == mesh
              for primitive in source['meshes'][mesh]['primitives']:
                  material = source['materials'][primitive['material']]
                  assert material.get('alphaMode', 'OPAQUE') == 'OPAQUE'
          assert 7645 in nodes(290) and 7645 in nodes(294)
          assert source['nodes'][7645]['extras']['sourceOnly'] is True
          assert source['nodes'][7645]['extras']['canApplyToViewer'] is False
          print('Exact V69P12R1 source, floor map, opaque doors and terrace source gate verified; no visibility override.')
