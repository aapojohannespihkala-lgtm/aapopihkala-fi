name: D-view exact-source WebGL regression

on:
  workflow_dispatch:
  # GITHUB_TOKEN automerge may not emit a new push-triggered workflow.
  # After the trusted main Build check succeeds, run the exact-source browser
  # gate for that same main commit. Keep WIF/GLB out of all PR workflows.
  workflow_run:
    workflows: [Build check]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - src/pages/private-model/index.astro
      - src/scripts/privateModelDViewRuntime.ts
      - src/scripts/c70_main_view_bridge.mjs
      - src/scripts/d_floor_router.mjs
      - src/scripts/privateModelC70Contract.json
      - src/scripts/privateModelC80Hi12Contract.json
      - src/scripts/c80Hi12Profile.json
      - src/scripts/c80Hi13Profile.json
      - src/scripts/privateModelC80Hi14Contract.json
      - src/scripts/c80Hi14Profile.json
      - src/scripts/privateModelC80Hi18Contract.json
      - src/scripts/c80Hi18Profile.json
      - src/scripts/privateModelC80Hi13Contract.json
      - src/scripts/c80SourceProfiles.mjs
      - src/scripts/c80Hi12Visibility.mjs
      - src/scripts/privateModelMainViewScope.ts
      - src/scripts/privateModelVisibleBounds.ts
      - src/scripts/privateModelSourceCards.ts
      - src/scripts/privateModelSharedBoundaryClip.mjs
      - src/scripts/privateModelSharedCdMaterialClip.mjs
      - src/scripts/privateModelT04*.mjs
      - src/scripts/privateModelOtherFloorReference.ts
      - tests/e2e/private-model-d-runtime-integration.spec.ts
      - tests/e2e/private-model-d-viewport-resize.spec.ts
      - tests/e2e/private-model-c70-integration.spec.ts
      - tests/e2e/private-model-hi12-integration.spec.ts
      - tests/e2e/private-model-hi18-integration.spec.ts
      - tests/e2e/private-model-p186e-one-link-autoload.spec.ts
      - .github/workflows/d-view-regression.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: d-view-exact-source-webgl
  # Read-only viewer QA is bound to one exact main head. A newer head supersedes it.
  cancel-in-progress: true

jobs:
  real-model-webgl:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository == 'aapojohannespihkala-lgtm/aapopihkala-fi' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'push' ||
         github.event.workflow_run.event == 'workflow_dispatch') &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main'))
    # Preserve every exact-source and legacy check, while giving each published
    # viewer its own bounded run instead of starving HI12 behind source software rendering.
    strategy:
      fail-fast: false
      matrix:
        mode: [source, c70-production, c80-production, hi12-production, hi13-source, hi13-production, hi14-source, hi14-production, hi18-source, hi18-production]
    name: Exact WebGL / ${{ matrix.mode }}
    # Match the build job's supported, stable browser dependency environment.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Authenticate read-only Drive source access on trusted main
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GDRIVE_WIF_PROVIDER }}
          service_account: ${{ vars.GDRIVE_PUBLISHER_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          create_credentials_file: false
          export_environment_variables: false
      - name: Fetch immutable sources and verify ZIP CRC and SHA
        env:
          GDRIVE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, os, pathlib, urllib.request, zipfile
          locks = [
            ('scene28', '1TUQsJlPRLVORes7MfT3BYJCbo56xYQRT', 978526,
             '14e506b41f80559b18643e8a4d3c67f089759c086310d27a5440f690112ced53',
             '9bd394795b6bee37de9aea6f6b128cf93e9489a34015852d2d59082a3529013e'),
            ('r4e', '1LoRfeI7JigrbR2S6hIsOJ7Q_DonYocAU', 1106851,
             'e840c5fa14c0f919aa9617fdd9cd3ae144f511e5e0a023641e6599431b074807',
             '2f42444401224f7b5bd62663c4227d78e3af0618c58c1961e317598cf7886680'),
            ('c70', '1hHD39DHJCE8mR-R-RW16Za00dAfEvYI9', 1281693,
             '4e901bd4cdcaf4e2258af543f86accb238aeab0b6031a69a1910c7d1cf4a5be2',
             '75b586aaf774bce34cf1dceba5d19e6ae41c112b8717f4cce5ce64458fddc491'),
            ('hi18', '1_TI-uh22pyJzB8UW806BaPiFFUXsPl-m', 1808454,
             '9c4ec079314397049ede46677230dfc347f43cdf43cf1d5f8066107e52379fa4',
             'b4f409bbd9094f86bc7b1ef766ca230f092ed36bcd31902272edb0e3117f4b19'),
            ('hi14', '1i3ZXB3oZ0cMusvlZJshU4xnak03kXGCd', 1466840,
             '0bccd595f0dcb6bc91fda21050e409442663f4aff12fe99ca0a4a70d448f9a66',
             '73a13e653b3f28679c3e6aae42a60432a84b30204e1a94844a0cbb59114a959c'),
            ('hi13', '1reQ5WcQI3jQw9t6YE_cfrs-v67JzqrnN', 2064045,
             'b5f8c80cab86f8ca5789e654b318aaffefebb7ce8c589a0fe453c91b843b7dd4',
             '145398c5fee2fccbedb820c4049117795fa1035265696511c854ba617ffe7b71'),
            ('hi12', '1Re8SKp3Uwxnb3jh-DZdDBlpOdJRQLECG', 1820552,
             '78166fe0ee56e92786339e735b8267d07c577ace3731b0ced02c49c67c6145bf',
             '4e5ed14c710c7e04484a8b0a1975afb9933115ca6734b0de772ef096e51fb0f7'),
            ('c80', '1x5Ahnl16RVa1OSqzlgLkHYbOD5CMm4m7', 1740505,
             '499daab0353005537f6e7d64cbc79e4778e9d4915030e8e6ddb2abbc982b725c',
             'c8230e1877a2fc2cd0c633c5247a92975b4669ae685f491fad9f45092fc11b8d'),
          ]
          for name, file_id, size, zip_sha, glb_sha in locks:
            request = urllib.request.Request(
              'https://www.googleapis.com/drive/v3/files/' + file_id + '?alt=media&supportsAllDrives=true',
              headers={'Authorization': 'Bearer ' + os.environ['GDRIVE_ACCESS_TOKEN']})
            with urllib.request.urlopen(request, timeout=60) as response:
              data = response.read(size + 1)
            assert len(data) == size and hashlib.sha256(data).hexdigest() == zip_sha, 'Source ZIP mismatch: ' + name
            with zipfile.ZipFile(io.BytesIO(data)) as archive:
              assert archive.testzip() is None, 'ZIP CRC: ' + name
              assert archive.getinfo('model.glb').file_size <= (13969984 if name == 'hi18' else 12116996 if name == 'hi14' else 12060676 if name == 'hi13' else 11999999)
              glb = archive.read('model.glb')
            assert hashlib.sha256(glb).hexdigest() == glb_sha, 'GLB source mismatch: ' + name
            pathlib.Path(os.environ['RUNNER_TEMP'], name + '.glb').write_bytes(glb)
            print(name + ': ZIP/CRC/GLB SHA PASS ' + glb_sha)
          PY
      - name: Actual R4E/C70/C80 source checks, WebGL2 pixels and lifecycle
        if: matrix.mode == 'source'
        env:
          YLIS_R4E_GLB: ${{ runner.temp }}/r4e.glb
          YLIS_SCENE28_GLB: ${{ runner.temp }}/scene28.glb
          YLIS_C70_GLB: ${{ runner.temp }}/c70.glb
          YLIS_C80_GLB: ${{ runner.temp }}/c80.glb
          YLIS_HI12_GLB: ${{ runner.temp }}/hi12.glb
          YLIS_REQUIRE_REAL: '1'
          D_VIEW_TESTED_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/d-view-report.json
        run: npx playwright test tests/e2e/private-model-d-runtime-integration.spec.ts tests/e2e/private-model-d-viewport-resize.spec.ts tests/e2e/private-model-c70-integration.spec.ts tests/e2e/private-model-hi12-integration.spec.ts --workers=1 --trace=off --reporter=line,json
      - name: Published protected viewer C70 local preview, desktop and mobile
        if: matrix.mode == 'c70-production'
        env:
          YLIS_C70_GLB: ${{ runner.temp }}/c70.glb
          YLIS_REQUIRE_REAL: '1'
          YLIS_C70_PRODUCTION: '1'
          CF_ACCESS_VIEWER_PROBE_CLIENT_ID: ${{ secrets.CF_ACCESS_VIEWER_PROBE_CLIENT_ID }}
          CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET: ${{ secrets.CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET }}
          D_VIEW_TESTED_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/c70-published-report.json
        run: npx playwright test tests/e2e/private-model-c70-integration.spec.ts --grep 'actual C70' --workers=1 --trace=off --output=test-results/c70-published --reporter=line,json
      - name: Published protected original C80, desktop and mobile
        if: matrix.mode == 'c80-production'
        env:
          YLIS_C70_GLB: ${{ runner.temp }}/c70.glb
          YLIS_C80_GLB: ${{ runner.temp }}/c80.glb
          YLIS_REQUIRE_REAL: '1'
          YLIS_C80_PRODUCTION: '1'
          CF_ACCESS_VIEWER_PROBE_CLIENT_ID: ${{ secrets.CF_ACCESS_VIEWER_PROBE_CLIENT_ID }}
          CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET: ${{ secrets.CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET }}
          D_VIEW_TESTED_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/c80-published-report.json
        run: npx playwright test tests/e2e/private-model-c70-integration.spec.ts --grep 'actual C80 protected' --workers=1 --trace=off --output=test-results/c80-published --reporter=line,json
      - name: Published protected HI12, desktop and mobile
        if: matrix.mode == 'hi12-production'
        env:
          YLIS_HI12_GLB: ${{ runner.temp }}/hi12.glb
          YLIS_REQUIRE_REAL: '1'
          YLIS_HI12_PRODUCTION: '1'
          CF_ACCESS_VIEWER_PROBE_CLIENT_ID: ${{ secrets.CF_ACCESS_VIEWER_PROBE_CLIENT_ID }}
          CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET: ${{ secrets.CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET }}
          D_VIEW_TESTED_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/hi12-published-report.json
        run: npx playwright test tests/e2e/private-model-hi12-integration.spec.ts --workers=1 --trace=off --output=test-results/hi12-published --reporter=line,json
      - name: HI13 exact successor source and browser lifecycle
        if: matrix.mode == 'hi13-source'
        env:
          YLIS_C80_SUCCESSOR: HI13
          YLIS_HI13_GLB: ${{ runner.temp }}/hi13.glb
          YLIS_C70_GLB: ${{ runner.temp }}/c70.glb
          YLIS_C80_GLB: ${{ runner.temp }}/c80.glb
          YLIS_REQUIRE_REAL: '1'
          D_VIEW_TESTED_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/hi13-source-report.json
        run: npx playwright test tests/e2e/private-model-hi12-integration.spec.ts --workers=1 --trace=off --output=test-results/hi13-source --reporter=line,json
      - name: Published protected HI13, desktop and mobile
        if: matrix.mode == 'hi13-production'
        env:
          YLIS_C80_SUCCESSOR: HI13
          YLIS_HI13_GLB: ${{ runner.temp }}/hi13.glb
          YLIS_REQUIRE_REAL: '1'
          YLIS_HI13_PRODUCTION: '1'
          CF_ACCESS_VIEWER_PROBE_CLIENT_ID: ${{ secrets.CF_ACCESS_VIEWER_PROBE_CLIENT_ID }}
          CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET: ${{ secrets.CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET }}
          D_VIEW_TESTED_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/hi13-published-report.json
        run: npx playwright test tests/e2e/private-model-hi12-integration.spec.ts --workers=1 --trace=off --output=test-results/hi13-published --reporter=line,json
      - name: HI14 exact successor source and browser lifecycle
        if: matrix.mode == 'hi14-source'
        env:
          YLIS_C80_SUCCESSOR: HI14
          YLIS_HI14_GLB: ${{ runner.temp }}/hi14.glb
          YLIS_C70_GLB: ${{ runner.temp }}/c70.glb
          YLIS_C80_GLB: ${{ runner.temp }}/c80.glb
          YLIS_REQUIRE_REAL: '1'
          D_VIEW_TESTED_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/hi14-source-report.json
        run: npx playwright test tests/e2e/private-model-hi12-integration.spec.ts --workers=1 --trace=off --output=test-results/hi14-source --reporter=line,json
      - name: Published protected HI14, desktop and mobile
        if: matrix.mode == 'hi14-production'
        env:
          YLIS_C80_SUCCESSOR: HI14
          YLIS_HI14_GLB: ${{ runner.temp }}/hi14.glb
          YLIS_HI14_PRODUCTION: '1'
          YLIS_REQUIRE_REAL: '1'
          CF_ACCESS_VIEWER_PROBE_CLIENT_ID: ${{ secrets.CF_ACCESS_VIEWER_PROBE_CLIENT_ID }}
          CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET: ${{ secrets.CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET }}
          D_VIEW_TESTED_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/hi14-published-report.json
        run: npx playwright test tests/e2e/private-model-hi12-integration.spec.ts --workers=1 --trace=off --output=test-results/hi14-published --reporter=line,json
      - name: HI18 exact successor source and browser lifecycle
        if: matrix.mode == 'hi18-source'
        env:
          YLIS_C80_SUCCESSOR: HI18
          YLIS_HI18_GLB: ${{ runner.temp }}/hi18.glb
          YLIS_C70_GLB: ${{ runner.temp }}/c70.glb
          YLIS_C80_GLB: ${{ runner.temp }}/c80.glb
          YLIS_REQUIRE_REAL: '1'
          D_VIEW_TESTED_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/hi18-source-report.json
        run: npx playwright test tests/e2e/private-model-hi18-integration.spec.ts --workers=1 --trace=off --output=test-results/hi18-source --reporter=line,json
      - name: Published protected HI18, desktop and mobile
        if: matrix.mode == 'hi18-production'
        env:
          YLIS_C80_SUCCESSOR: HI18
          YLIS_HI18_GLB: ${{ runner.temp }}/hi18.glb
          YLIS_HI18_PRODUCTION: '1'
          YLIS_REQUIRE_REAL: '1'
          CF_ACCESS_VIEWER_PROBE_CLIENT_ID: ${{ secrets.CF_ACCESS_VIEWER_PROBE_CLIENT_ID }}
          CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET: ${{ secrets.CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET }}
          D_VIEW_TESTED_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/hi18-published-report.json
        run: npx playwright test tests/e2e/private-model-hi18-integration.spec.ts --workers=1 --trace=off --output=test-results/hi18-published --reporter=line,json
      - name: Encrypt private model screenshots before artifact storage
        if: always()
        env:
          D_VIEW_EVIDENCE_PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA2Wb28lKfJ8xHD91rtdd8
            RGE5jPi94X4nyXYjmpu73IGLztOYCHmTnuggQ5YwQKYM5bIF9DccSC39j2zT2K8J
            6s0a+8ez6buU4Bbq3pdRtUo63Lb+PmsvZr30XUW4daMu56Z8yCY+q1uQBGImN+zw
            yCUHCU14nVagKkCiqShi4FK7AEo+YJY4pel26X4ZlT/25XsCKt+rgUe/Vz1QcB5D
            5wZDNC3+cwXG2J6vjVGjHdsnRF8MqDXd+wcg0ufivbQORKN2GEgBSpMWjvhMKEbF
            IzOdnOKyCMJjB0/z3iWaGja+eosVaP10LbgiGks73ttewm7UHk40rZdq0LNwMT34
            swIDAQAB
            -----END PUBLIC KEY-----
          D_VIEW_EVIDENCE_AUDIT_PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEArG5ZmPrkwOGDqpbKU3RF
            qJwdDxV3od6p1g8n3/CPXZYdg2jsbzZhtwmQiepEr1s3u8+FRgDpslrR25oPUz4C
            zP/kZoqrTLNJ+XjHg+j/jNrH+GxgH4AZIjikvEkLGWM4WfgjUg1B15otPxK15kX+
            yw5cyjaZEvuNfv88dolbnikY6IWgPUzqiUIJ6nZmOcr4eX7AE0EO87HKqjt3zOwM
            B2BBGTh2j1/3glXEYX3RjLzaERTpRuvIVdV8G1kDX/+xByK7uktf9hCTXY8hKYO2
            ThZ+WPMHK1oNjW3WzoFT73LHt6UhhH4fHJq58OOupqYISU6PtUl/L1Hpl6Kc7gaC
            2QIDAQAB
            -----END PUBLIC KEY-----
        shell: bash
        run: |
          set -euo pipefail
          [[ -d test-results ]] || exit 0
          mkdir -p "$RUNNER_TEMP/d-view-evidence"
          printf '%s\n' "$D_VIEW_EVIDENCE_PUBLIC_KEY" > "$RUNNER_TEMP/d-view-evidence-public.pem"
          printf '%s\n' "$D_VIEW_EVIDENCE_AUDIT_PUBLIC_KEY" > "$RUNNER_TEMP/d-view-evidence-audit-public.pem"
          openssl rand -base64 48 > "$RUNNER_TEMP/d-view-evidence-password"
          tar -czf "$RUNNER_TEMP/d-view-evidence.tar.gz" test-results
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -pass "file:$RUNNER_TEMP/d-view-evidence-password" \
            -in "$RUNNER_TEMP/d-view-evidence.tar.gz" -out "$RUNNER_TEMP/d-view-evidence/evidence.enc"
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/d-view-evidence-public.pem" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in "$RUNNER_TEMP/d-view-evidence-password" -out "$RUNNER_TEMP/d-view-evidence/password.rsa"
          # Preserve the original recipient and add this C80 inspection recipient.
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/d-view-evidence-audit-public.pem" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in "$RUNNER_TEMP/d-view-evidence-password" -out "$RUNNER_TEMP/d-view-evidence/password.audit.rsa"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d-view-exact-source-webgl-${{ github.event.workflow_run.head_sha || github.sha }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/d-view-evidence/
          if-no-files-found: warn
          retention-days: 3


