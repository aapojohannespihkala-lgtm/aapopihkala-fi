name: Publish source reference

on:
  workflow_dispatch:
    inputs:
      reference:
        description: Allowlisted private source reference id
        required: true
        default: m5a-drainman
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-source-reference
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require trusted main dispatch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_REPOSITORY" == "aapojohannespihkala-lgtm/aapopihkala-fi" ]]

      - name: Checkout exact main source-reference registry
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Resolve allowlisted source reference
        shell: bash
        env:
          REQUESTED_REFERENCE: ${{ inputs.reference }}
        run: |
          set -euo pipefail

          python3 - ".github/source-reference-candidates.json" "$REQUESTED_REFERENCE" "$GITHUB_ENV" <<'PY'
          import json
          import re
          import sys

          registry_path, reference_id, env_path = sys.argv[1:]
          with open(registry_path, "r", encoding="utf-8") as handle:
              payload = json.load(handle)

          if set(payload) != {"version", "references"} or payload.get("version") != 1:
              raise SystemExit("invalid source-reference registry envelope")

          references = payload.get("references")
          if not isinstance(references, dict):
              raise SystemExit("invalid source-reference registry")

          if not re.fullmatch(r"[a-z0-9][a-z0-9-]{0,127}", reference_id):
              raise SystemExit("invalid source-reference id")

          entry = references.get(reference_id)
          if not isinstance(entry, dict) or set(entry) != {
              "driveFileId",
              "expectedSize",
              "expectedSha256",
              "path",
          }:
              raise SystemExit("unsupported source reference")

          drive_file_id = entry["driveFileId"]
          expected_size = entry["expectedSize"]
          expected_sha256 = entry["expectedSha256"]
          expected_path = entry["path"]

          if not isinstance(drive_file_id, str) or not re.fullmatch(r"[A-Za-z0-9_-]{10,128}", drive_file_id):
              raise SystemExit("invalid source-reference Drive file id")
          if not isinstance(expected_size, int) or expected_size < 1:
              raise SystemExit("invalid source-reference expected size")
          if not isinstance(expected_sha256, str) or not re.fullmatch(r"[0-9a-f]{64}", expected_sha256):
              raise SystemExit("invalid source-reference SHA-256")
          if expected_path != f"/private-model/source-reference/{reference_id}.pdf":
              raise SystemExit("invalid source-reference path")

          values = {
              "DRIVE_FILE_ID": drive_file_id,
              "REFERENCE_ID": reference_id,
              "EXPECTED_SIZE": str(expected_size),
              "EXPECTED_SHA256": expected_sha256,
              "EXPECTED_PATH": expected_path,
              "PUBLISH_URL": f"https://aapopihkala.fi/private-model/work-test/publish/source-reference-{reference_id}.pdf",
              "READBACK_URL": f"https://aapopihkala.fi/private-model/work-test/verify/source-reference-{reference_id}.pdf",
          }
          with open(env_path, "a", encoding="utf-8") as handle:
              for key, value in values.items():
                  handle.write(f"{key}={value}\n")
          PY

      - name: Require machine-auth configuration
        shell: bash
        env:
          GDRIVE_WIF_PROVIDER: ${{ vars.GDRIVE_WIF_PROVIDER }}
          GDRIVE_PUBLISHER_SERVICE_ACCOUNT: ${{ vars.GDRIVE_PUBLISHER_SERVICE_ACCOUNT }}
          CF_ACCESS_PUBLISHER_CLIENT_ID: ${{ secrets.CF_ACCESS_PUBLISHER_CLIENT_ID }}
          CF_ACCESS_PUBLISHER_CLIENT_SECRET: ${{ secrets.CF_ACCESS_PUBLISHER_CLIENT_SECRET }}
          CF_ACCESS_READBACK_CLIENT_ID: ${{ secrets.CF_ACCESS_READBACK_CLIENT_ID }}
          CF_ACCESS_READBACK_CLIENT_SECRET: ${{ secrets.CF_ACCESS_READBACK_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          [[ -n "$GDRIVE_WIF_PROVIDER" ]] || { echo "Missing GDRIVE_WIF_PROVIDER repository variable" >&2; exit 1; }
          [[ -n "$GDRIVE_PUBLISHER_SERVICE_ACCOUNT" ]] || { echo "Missing GDRIVE_PUBLISHER_SERVICE_ACCOUNT repository variable" >&2; exit 1; }
          [[ -n "$CF_ACCESS_PUBLISHER_CLIENT_ID" ]] || { echo "Missing CF_ACCESS_PUBLISHER_CLIENT_ID secret" >&2; exit 1; }
          [[ -n "$CF_ACCESS_PUBLISHER_CLIENT_SECRET" ]] || { echo "Missing CF_ACCESS_PUBLISHER_CLIENT_SECRET secret" >&2; exit 1; }
          [[ -n "$CF_ACCESS_READBACK_CLIENT_ID" ]] || { echo "Missing CF_ACCESS_READBACK_CLIENT_ID secret" >&2; exit 1; }
          [[ -n "$CF_ACCESS_READBACK_CLIENT_SECRET" ]] || { echo "Missing CF_ACCESS_READBACK_CLIENT_SECRET secret" >&2; exit 1; }

      - name: Authenticate to Google Drive
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GDRIVE_WIF_PROVIDER }}
          service_account: ${{ vars.GDRIVE_PUBLISHER_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          create_credentials_file: false
          export_environment_variables: false

      - name: Download and verify exact private Drive PDF identity
        shell: bash
        env:
          GDRIVE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          source_pdf="$RUNNER_TEMP/source-reference.pdf"
          curl --silent --show-error --fail --location             --header "Authorization: Bearer $GDRIVE_ACCESS_TOKEN"             --output "$source_pdf"             "https://www.googleapis.com/drive/v3/files/$DRIVE_FILE_ID?alt=media&supportsAllDrives=true"

          actual_size="$(stat -c '%s' "$source_pdf")"
          actual_sha="$(sha256sum "$source_pdf" | awk '{print $1}')"
          [[ "$(head -c 5 "$source_pdf")" == "%PDF-" ]] || { echo "Drive source is not a PDF" >&2; exit 1; }
          [[ "$actual_size" == "$EXPECTED_SIZE" ]] || { echo "Drive source size mismatch" >&2; exit 1; }
          [[ "$actual_sha" == "$EXPECTED_SHA256" ]] || { echo "Drive source SHA-256 mismatch" >&2; exit 1; }

          echo "Exact Drive source-reference identity verified."

      - name: Publish exact PDF through machine-only endpoint
        shell: bash
        env:
          CF_ACCESS_PUBLISHER_CLIENT_ID: ${{ secrets.CF_ACCESS_PUBLISHER_CLIENT_ID }}
          CF_ACCESS_PUBLISHER_CLIENT_SECRET: ${{ secrets.CF_ACCESS_PUBLISHER_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          source_pdf="$RUNNER_TEMP/source-reference.pdf"
          response="$RUNNER_TEMP/source-reference-publish-response.json"

          headers="$RUNNER_TEMP/source-reference-publish-headers.txt"
          http_code="$(curl --silent --show-error \
            --request PUT \
            --header "CF-Access-Client-Id: $CF_ACCESS_PUBLISHER_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $CF_ACCESS_PUBLISHER_CLIENT_SECRET" \
            --header "Content-Type: application/pdf" \
            --header "Content-Length: $EXPECTED_SIZE" \
            --data-binary "@$source_pdf" \
            --dump-header "$headers" \
            --output "$response" \
            --write-out "%{http_code}" \
            "$PUBLISH_URL")"

          python3 - "$http_code" "$headers" <<'PY'
          import sys
          from urllib.parse import urlsplit, urlunsplit

          status, header_path = sys.argv[1:]
          content_type = ""
          location = ""
          with open(header_path, "r", encoding="iso-8859-1") as handle:
              for raw in handle:
                  line = raw.rstrip("\r\n")
                  lower = line.lower()
                  if lower.startswith("content-type:"):
                      content_type = line.split(":", 1)[1].strip()
                  elif lower.startswith("location:"):
                      value = line.split(":", 1)[1].strip()
                      parts = urlsplit(value)
                      location = urlunsplit((parts.scheme, parts.netloc, parts.path, "", "")) if parts.scheme else value.split("?", 1)[0]

          print(f"Source-reference publish HTTP status={status}")
          print(f"Source-reference publish Content-Type={content_type or '<none>'}")
          print(f"Source-reference publish Location={location or '<none>'}")

          if not status.startswith("2"):
              raise SystemExit("source-reference publish returned non-2xx status")
          if not content_type.lower().startswith("application/json"):
              raise SystemExit("source-reference publish returned non-JSON content type")
          PY

          python3 - "$response" "$REFERENCE_ID" "$EXPECTED_PATH" <<'PY'
          import json
          import sys

          path, reference_id, expected_path = sys.argv[1:]
          with open(path, "r", encoding="utf-8") as handle:
              payload = json.load(handle)

          reference = payload.get("reference") or {}
          if payload.get("ready") is not True:
              raise SystemExit("source-reference publish response is not ready")
          if reference.get("id") != reference_id:
              raise SystemExit("source-reference id mismatch")
          if reference.get("path") != expected_path:
              raise SystemExit("source-reference path mismatch")
          PY

      - name: Read full production PDF back and verify bytes
        shell: bash
        env:
          CF_ACCESS_READBACK_CLIENT_ID: ${{ secrets.CF_ACCESS_READBACK_CLIENT_ID }}
          CF_ACCESS_READBACK_CLIENT_SECRET: ${{ secrets.CF_ACCESS_READBACK_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          readback="$RUNNER_TEMP/source-reference-production-readback.pdf"

          curl --silent --show-error --fail             --connect-timeout 10             --max-time 60             --header "CF-Access-Client-Id: $CF_ACCESS_READBACK_CLIENT_ID"             --header "CF-Access-Client-Secret: $CF_ACCESS_READBACK_CLIENT_SECRET"             --output "$readback"             "$READBACK_URL"

          readback_size="$(stat -c '%s' "$readback")"
          readback_sha="$(sha256sum "$readback" | awk '{print $1}')"
          [[ "$readback_size" == "$EXPECTED_SIZE" ]] || { echo "Production PDF size mismatch" >&2; exit 1; }
          [[ "$readback_sha" == "$EXPECTED_SHA256" ]] || { echo "Production PDF SHA-256 mismatch" >&2; exit 1; }
          [[ "$(head -c 5 "$readback")" == "%PDF-" ]] || { echo "Production readback is not a PDF" >&2; exit 1; }

          echo "Production source-reference byte-for-byte readback verified."

      - name: Remove private temporary files
        if: always()
        shell: bash
        run: |
          rm -f             "$RUNNER_TEMP/source-reference.pdf"             "$RUNNER_TEMP/source-reference-production-readback.pdf"             "$RUNNER_TEMP/source-reference-publish-response.json"             "$RUNNER_TEMP/source-reference-publish-headers.txt"
