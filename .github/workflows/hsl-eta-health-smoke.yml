name: HSL ETA health smoke

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

concurrency:
  group: hsl-eta-health-smoke
  cancel-in-progress: true

jobs:
  hsl_eta_health:
    runs-on: ubuntu-latest
    steps:
      - name: Read production HSL ETA health metrics
        shell: bash
        run: |
          set -euo pipefail

          url="https://aapopihkala.fi/api/current/hsl?eta_health_smoke=${GITHUB_RUN_ID}"

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 25 \
            --request POST \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --header 'Cache-Control: no-cache' \
            --data '{"stopCode":"E3239","stopName":"Ylisrinne","routes":["121","125"]}' \
            "$url" \
            --output hsl-eta-health.json

          node <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('hsl-eta-health.json', 'utf8'));
          const learning = body.learning;
          const failures = [];

          if (body.source !== 'HSL Digitransit') failures.push(`unexpected source: ${String(body.source)}`);
          if (body.stop?.code !== 'E3239') failures.push(`unexpected stop: ${String(body.stop?.code)}`);
          if (!Array.isArray(body.departures)) failures.push('departures missing');
          if (!learning || learning.enabled !== true) failures.push('learning summary missing');

          const numericFields = [
            'observations',
            'arrivals',
            'dueTrips',
            'detectedDueTrips',
            'scoredTrips',
            'modelScoredTrips',
            'modelWins',
          ];
          for (const field of numericFields) {
            if (!Number.isFinite(learning?.[field])) failures.push(`learning.${field} missing or invalid`);
          }

          if (failures.length > 0) {
            console.error(`HSL ETA health invalid: ${failures.join(' | ')}`);
            process.exit(1);
          }

          const fmtMae = (value) => Number.isFinite(value) ? `${(value / 60).toFixed(2)} min` : 'n/a';
          const departures = body.departures.length;
          console.log(
            `HSL ETA HEALTH: OBS=${learning.observations} ARRIVALS=${learning.arrivals} ` +
            `PASSAGES=${learning.detectedDueTrips}/${learning.dueTrips} ` +
            `SCORED=${learning.modelScoredTrips}/${learning.scoredTrips} ` +
            `HSL_MAE=${fmtMae(learning.hslMaeSeconds)} AAPO_MAE=${fmtMae(learning.modelMaeSeconds)} ` +
            `AAPO_WINS=${learning.modelWins}/${learning.modelScoredTrips} DEPARTURES=${departures} ` +
            `LAST_ARRIVAL=${learning.lastArrivalAt ?? 'n/a'}`
          );
          NODE
