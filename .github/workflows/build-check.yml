name: Build check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify validation mode
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          docs_only=false

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            mapfile -t changed_files < <(git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA")
          elif [[ "$EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            mapfile -t changed_files < <(git diff --name-only "$PUSH_BEFORE_SHA" "$CURRENT_SHA")
          else
            changed_files=()
          fi

          if [[ ${#changed_files[@]} -gt 0 ]]; then
            docs_only=true
            for file in "${changed_files[@]}"; do
              case "$file" in
                README.md|AGENTS.md|ROADMAP.md|docs/*)
                  ;;
                *)
                  docs_only=false
                  break
                  ;;
              esac
            done
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

      - name: Documentation-only fast path
        if: steps.changes.outputs.docs_only == 'true'
        run: echo "Documentation-only change; executable project validation skipped."

      - name: Setup Node
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.docs_only != 'true'
        run: npm ci

      - name: Static checks
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run check

      - name: Production build
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run build

      - name: Install Chromium
        if: steps.changes.outputs.docs_only != 'true' && github.event_name != 'pull_request'
        run: npx playwright install --with-deps chromium

      - name: Browser regression tests
        if: steps.changes.outputs.docs_only != 'true' && github.event_name != 'pull_request'
        run: npm run test:e2e

      - name: Upload browser test artifacts
        if: failure() && steps.changes.outputs.docs_only != 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
