name: Build check

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
  workflow_dispatch:
    inputs:
      replay_pr:
        description: 'Owner PR number after bot refresh (empty for normal dispatch)'
        type: string
        required: false
      replay_sha:
        description: 'Exact refreshed PR head commit SHA'
        type: string
        required: false
      replay_round:
        description: 'Bounded automatic refresh count (1 or 2)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: build-check-${{ inputs.replay_pr || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Keep browser dependencies off the observed 26.04 font-mirror stall.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Dispatch runs on the PR branch and carries its exact head SHA so the
      # GitHub Actions check is attached to that commit, not an older green SHA.
      - name: Verify trusted bot-refresh replay
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.replay_pr != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPLAY_PR: ${{ inputs.replay_pr }}
          REPLAY_SHA: ${{ inputs.replay_sha }}
          REPLAY_ROUND: ${{ inputs.replay_round }}
        run: |
          set -euo pipefail
          [[ "$REPLAY_PR" =~ ^[1-9][0-9]*$ ]]
          [[ "$REPLAY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REPLAY_ROUND" =~ ^[12]$ ]]
          [[ "$GITHUB_SHA" == "$REPLAY_SHA" ]] || { echo "::error::Replay ref SHA changed"; exit 1; }
          pr="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${REPLAY_PR}")"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg owner "${GITHUB_REPOSITORY%%/*}" \
            --arg sha "$REPLAY_SHA" --arg branch "$GITHUB_REF_NAME" \
            '.state=="open" and .draft==false and .base.ref=="main" and
             .head.repo.full_name==$repo and .user.login==$owner and
             .head.sha==$sha and .head.ref==$branch' <<< "$pr" >/dev/null
          changed="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls/${REPLAY_PR}/files" --jq '.[].filename')"
          if grep -Eq '^\.github/workflows/' <<< "$changed"; then
            echo "::error::Workflow-changing PRs cannot use bot replay" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.replay_pr != '' && inputs.replay_sha || github.sha }}

      - name: Classify validation mode
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPLAY_PR: ${{ inputs.replay_pr }}
        run: |
          set -euo pipefail

          docs_only=false
          css_only=false

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            mapfile -t changed_files < <(git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA")
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$REPLAY_PR" ]]; then
            mapfile -t changed_files < <(gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls/${REPLAY_PR}/files" --jq '.[].filename')
          elif [[ "$EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            mapfile -t changed_files < <(git diff --name-only "$PUSH_BEFORE_SHA" "$CURRENT_SHA")
          else
            changed_files=()
          fi

          if [[ ${#changed_files[@]} -gt 0 ]]; then
            docs_only=true
            css_only=true

            for file in "${changed_files[@]}"; do
              case "$file" in
                README.md|AGENTS.md|CHATGPT.md|ROADMAP.md|docs/*)
                  ;;
                *)
                  docs_only=false
                  ;;
              esac

              case "$file" in
                *.css)
                  ;;
                *)
                  css_only=false
                  ;;
              esac

            done
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "css_only=$css_only" >> "$GITHUB_OUTPUT"
          browser_tests="$(bash .github/scripts/select-browser-tests.sh "${changed_files[@]}" | paste -sd ' ' -)"
          echo "browser_tests=$browser_tests" >> "$GITHUB_OUTPUT"
          echo "Selected pre-merge browser tests: ${browser_tests:-none}"

      - name: Verify browser test selection
        run: python3 .github/scripts/test-select-browser-tests.py

      - name: Verify bot-refresh replay policy
        run: python3 .github/scripts/test-build-check-bot-refresh.py

      - name: Verify WORK_TEST publisher contract
        run: python3 .github/scripts/test-publish-work-test-workflow.py

      - name: Verify CURRENT publisher contract
        run: python3 .github/scripts/test-publish-current-model-workflow.py

      - name: Verify source156 WORK_TEST staging bindings
        if: steps.changes.outputs.docs_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq '"d1f-source156-mirror305-k2-oak-u-two-pulls-20261018"' .github/work-test-candidates.json; then
            test -f tests/test-d1f-scene143-work-test-candidate.py
            test -f tests/test-d1f-scene150-work-test-candidate.py
            python3 tests/test-d1f-scene143-work-test-candidate.py -v
            python3 tests/test-d1f-scene150-work-test-candidate.py -v
          else
            echo 'source156 candidate not staged; no source156 tests required'
          fi

      - name: Documentation-only fast path
        if: steps.changes.outputs.docs_only == 'true'
        run: echo "Documentation-only change; executable project validation skipped."

      - name: Setup Node
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.docs_only != 'true'
        run: npm ci

      # Regression gates for D-view source identity, floor clipping and
      # unverified K14/K17 components. These synthetic-source tests cannot
      # certify actual GLB/browser output, but must fail every executable PR
      # if a previously protected HOLD or identity contract regresses.
      - name: Verify D-view source and model gates
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.css_only != 'true'
        run: |
          node --test \
            tests/unit/check-d-scene32-preview-parity.test.mjs \
            tests/unit/check-k14-roof-crossings.test.mjs \
            tests/unit/private-model-k14-roof-view-clip.test.mjs \
            tests/unit/shared-boundary-local-clip.test.mjs \
            tests/unit/private-model-stair-host-gate.test.mjs \
            tests/unit/private-model-t04-primitive-source-binding.test.mjs \
            tests/unit/private-model-source-node-associations.test.mjs
            tests/unit/private-model-hi20-unified52-source-scenes.test.mjs

      # Four self-contained K16-b/c scene33 builder guards run on every
      # executable PR. The optional original-Drive-source replay remains
      # skipped without the SHA-pinned private source ZIP.
      - name: Verify K16bc source-locked scene33 builder
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.css_only != 'true'
        run: python3 -m unittest discover -s tests/unit -p 'test_build_k16bc_scene33.py' -v

      - name: Static checks
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.css_only != 'true'
        run: npm run check

      - name: CSS-only fast path
        if: steps.changes.outputs.css_only == 'true'
        run: echo "CSS-only change; Astro static checks skipped and production build retained."

      - name: Production build
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run build

      - name: Install Chromium
        if: >-
          steps.changes.outputs.docs_only != 'true' &&
          (github.event_name != 'pull_request' || steps.changes.outputs.browser_tests != '')
        run: npx playwright install --with-deps chromium

      - name: Selected browser guards
        if: >-
          (github.event_name == 'pull_request' ||
           (github.event_name == 'workflow_dispatch' && inputs.replay_pr != '')) &&
          steps.changes.outputs.browser_tests != ''
        env:
          BROWSER_TESTS: ${{ steps.changes.outputs.browser_tests }}
        shell: bash
        run: |
          read -r -a specs <<< "$BROWSER_TESTS"
          # Preserve K14's actual WebGL half-space/pixel contract on all selected browser runs.
          if [[ " ${specs[*]} " != *" tests/e2e/private-model-k14-roof-clip-webgl.spec.ts "* ]]; then
            specs+=(tests/e2e/private-model-k14-roof-clip-webgl.spec.ts)
          fi
          # Protect T04 C/D floor-clipping half-space in real Chromium/WebGL whenever
          # any browser guards run. The private R4E companion still SKIPs without the GLB.
          if [[ " ${specs[*]} " != *" tests/e2e/private-model-t04-clip-sign.spec.ts "* ]]; then
            specs+=(tests/e2e/private-model-t04-clip-sign.spec.ts)
          fi
          npx playwright test "${specs[@]}"

      - name: Browser regression tests
        if: steps.changes.outputs.docs_only != 'true' && github.event_name != 'pull_request' && inputs.replay_pr == ''
        run: npm run test:e2e

      - name: Upload browser test artifacts
        if: failure() && steps.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore

  merge:
    needs: build
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == github.repository_owner) ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.replay_pr != '' && inputs.replay_sha != '')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Merge or refresh pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.replay_pr }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.replay_sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          REPLAY_ROUND: ${{ inputs.replay_round || '0' }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REPLAY_ROUND" =~ ^[0-2]$ ]]

          # Recheck authorization, requested SHA and origin after browser tests.
          pr="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg owner "${GITHUB_REPOSITORY%%/*}" \
            --arg sha "$HEAD_SHA" --arg branch "$HEAD_REF" \
            '.state=="open" and .draft==false and .base.ref=="main" and
             .head.repo.full_name==$repo and .user.login==$owner and
             .head.sha==$sha and .head.ref==$branch' <<< "$pr" >/dev/null

          android_changed=false
          if gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename' | grep -Eq '^(android-snapshot-widget/|\.github/workflows/android-snapshot-widget\.yml$)'; then
            android_changed=true
          fi

          d1f_probe_changed=false
          if gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename' | grep -Eq '^(src/pages/private-model/|src/scripts/privateModelD1F|\.github/scripts/private-model-d1f|\.github/workflows/(build-check|private-model-production-review-smoke)\.yml$)'; then
            d1f_probe_changed=true
          fi

          state="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.mergeable_state')"

          if [[ "$state" == "behind" ]]; then
            # GitHub Actions GITHUB_TOKEN cannot refresh a stale PR that edits workflow files.
            # Keep the gate closed and require an authorized GitHub branch update instead.
            changed_pr_paths="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename')"
            if grep -Eq '^\.github/workflows/' <<< "$changed_pr_paths"; then
              echo "::error::This PR edits GitHub Actions workflows and is behind main. GITHUB_TOKEN cannot update workflow-file branches (403). Use the GitHub Update branch action with an authorized identity; then CI will re-run." >&2
              exit 1
            fi
            if (( REPLAY_ROUND >= 2 )); then
              echo "::error::PR still behind main after two replay cycles; fail closed" >&2
              exit 1
            fi
            gh api --method PUT \
              "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/update-branch" \
              --raw-field expected_head_sha="$HEAD_SHA"
            # GITHUB_TOKEN branch updates do not emit pull_request synchronize.
            # Dispatch explicitly on the updated PR branch: check attaches to new SHA.
            refreshed=""
            for poll in $(seq 1 15); do
              refreshed="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
              if [[ "$refreshed" != "$HEAD_SHA" ]]; then break; fi
              sleep 2
            done
            [[ "$refreshed" =~ ^[0-9a-f]{40}$ && "$refreshed" != "$HEAD_SHA" ]] || {
              echo "::error::Updated branch SHA not observed; no replay" >&2
              exit 1
            }
            # Use a bracketed input map for the REST dispatch endpoint.
            gh api --method POST \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/build-check.yml/dispatches" \
              --raw-field ref="$HEAD_REF" \
              -f "inputs[replay_pr]=$PR_NUMBER" \
              -f "inputs[replay_sha]=$refreshed" \
              -f "inputs[replay_round]=$((REPLAY_ROUND + 1))"
            echo "PR refresh replay dispatched for exact new SHA $refreshed"
            exit 0
          fi

          if [[ "$android_changed" == "true" ]]; then
            echo "Waiting for Android Snapshot Widget PR validation for ${HEAD_SHA}."
            android_ready=false

            for attempt in $(seq 1 60); do
              android_run="$(gh api --method GET \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/android-snapshot-widget.yml/runs?event=pull_request&head_sha=${HEAD_SHA}&per_page=20" \
                --jq '.workflow_runs | max_by(.run_number) | if . == null then "" else "\(.status) \(.conclusion // "")" end')"
              android_status=""
              android_conclusion=""
              read -r android_status android_conclusion <<< "$android_run"

              if [[ "$android_status" == "completed" ]]; then
                if [[ "$android_conclusion" != "success" ]]; then
                  echo "Android Snapshot Widget validation finished with ${android_conclusion:-unknown}." >&2
                  exit 1
                fi
                android_ready=true
                echo "Android Snapshot Widget validation passed."
                break
              fi

              if [[ "$attempt" -lt 60 ]]; then
                sleep 10
              fi
            done

            if [[ "$android_ready" != "true" ]]; then
              echo "Timed out waiting for Android Snapshot Widget validation." >&2
              exit 1
            fi
          fi

          for attempt in $(seq 1 15); do
            if merged="$(gh api --method PUT \
              "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
              --raw-field merge_method=squash \
              --raw-field sha="$HEAD_SHA" \
              --jq '.merged')"; then
              if [[ "$merged" == "true" ]]; then
                gh api --method POST \
                  "/repos/${GITHUB_REPOSITORY}/actions/workflows/build-check.yml/dispatches" \
                  --raw-field ref=main
                gh api --method POST \
                  "/repos/${GITHUB_REPOSITORY}/actions/workflows/current2-live-data-smoke.yml/dispatches" \
                  --raw-field ref=main
                gh api --method POST \
                  "/repos/${GITHUB_REPOSITORY}/actions/workflows/current-external-feed-smoke.yml/dispatches" \
                  --raw-field ref=main
                gh api --method POST \
                  "/repos/${GITHUB_REPOSITORY}/actions/workflows/current-snapshot-browser-smoke.yml/dispatches" \
                  --raw-field ref=main
                gh api --method POST \
                  "/repos/${GITHUB_REPOSITORY}/actions/workflows/current-weather-hsl-smoke.yml/dispatches" \
                  --raw-field ref=main

                if [[ "$d1f_probe_changed" == "true" ]]; then
                  d1f_request="$RUNNER_TEMP/d1f-production-review-dispatch.json"
                  python3 -c 'import json,sys; json.dump({"ref":"main","inputs":{"probe_mode":"d1f-combined-pixels","review_id":"d1f-combined-wall-115-100-20261013-review","candidate_id":"d1f-combined-wall-115-100-20261013"}},open(sys.argv[1],"w"))' "$d1f_request"
                  gh api --method POST \
                    "/repos/${GITHUB_REPOSITORY}/actions/workflows/private-model-production-review-smoke.yml/dispatches" \
                    --input "$d1f_request"
                  rm -f "$d1f_request"
                  echo "D1F published-source pixel verification dispatched on trusted main."

                  # Queue the measured five-target source proof separately from the legacy four-target proof.
                  # Both calls use the existing main-only workflow and its non-cancelling production queue.
                  python3 -c 'import json,sys; json.dump({"ref":"main","inputs":{"probe_mode":"d1f-measured-pixels","review_id":"d1f-measured-wall-140-100-2350-b710-basin-20261014-review","candidate_id":"d1f-measured-wall-140-100-2350-b710-basin-20261014"}},open(sys.argv[1],"w"))' "$d1f_request"
                  gh api --method POST \
                    "/repos/${GITHUB_REPOSITORY}/actions/workflows/private-model-production-review-smoke.yml/dispatches" \
                    --input "$d1f_request"
                  rm -f "$d1f_request"
                  echo "Measured D1F five-target source pixel verification dispatched on trusted main."
                fi

                if [[ "$android_changed" == "true" ]]; then
                  gh api --method POST \
                    "/repos/${GITHUB_REPOSITORY}/actions/workflows/android-snapshot-widget.yml/dispatches" \
                    --raw-field ref=main
                  echo "Android files changed; signed APK release build dispatched."
                fi

                echo "Pull request merged; full main validation and Current live smokes dispatched."

                if [[ -n "$HEAD_REF" && "$HEAD_REF" != "main" ]]; then
                  if gh api --method DELETE \
                    "/repos/${GITHUB_REPOSITORY}/git/refs/heads/${HEAD_REF}" >/dev/null 2>&1; then
                    echo "Merged pull request branch ${HEAD_REF} deleted."
                  else
                    echo "Merged pull request branch ${HEAD_REF} could not be deleted; merge remains successful."
                  fi
                fi

                exit 0
              fi
            fi

            if [[ "$attempt" -lt 15 ]]; then
              echo "Merge attempt ${attempt} did not pass repository rule propagation yet; retrying in 10 seconds."
              sleep 10
            fi
          done

          echo "Automatic merge failed after required CI passed and status-propagation retries." >&2
          exit 1

  # The repository owner bot dispatches main Build check via GITHUB_TOKEN.
  # A workflow_run downstream trigger is not guaranteed to fire in that chain.
  # Use a trusted main-only dispatch job AFTER the full main build succeeds.
  # Neither private model bytes nor Drive tokens enter this small dispatch job.
  d-view-exact-source-dispatch:
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'aapojohannespihkala-lgtm/aapopihkala-fi' &&
      github.ref == 'refs/heads/main' &&
      inputs.replay_pr == '' &&
      inputs.replay_sha == ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger exact-source D-view WebGL on trusted main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/d-view-regression.yml/dispatches" \
            --raw-field ref=main
