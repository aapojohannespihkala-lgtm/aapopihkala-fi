name: Build check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Vol 4 runtime migration
        run: node scripts/migrate-meshy-vol4-runtime.mjs

      - name: Static checks
        run: npm run check

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser regression tests
        run: npm run test:e2e

      - name: Commit validated Vol 4 migration
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- src/components/MeshyPixelatedPoiseVol4.astro; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/MeshyPixelatedPoiseVol4.astro
            git commit -m "Migrate Pixelated Poise Vol 4 to shared Three.js runtime"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Upload browser test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
