name: Current test repair helper

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair-and-validate:
    if: github.event.pull_request.draft == true && github.head_ref == 'fix/postmerge-current-tests-20260907'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm

      - name: Repair stale Current regression expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          regression = Path('tests/e2e/current-regression.spec.ts')
          text = regression.read_text()
          old_title = "test('Current renders electricity above the compact Olari weather view', async ({ page }) => {"
          new_title = "test('Current renders the compact Olari weather view above electricity', async ({ page }) => {"
          if old_title in text:
              text = text.replace(old_title, new_title, 1)
          elif new_title not in text:
              raise SystemExit('Current regression title did not match expected old or new state')

          old_order = "  await expect(page.locator('.current-electricity-wrap + .current-weather-wrap')).toHaveCount(1);"
          new_order = "  await expect(\n    page.locator('[data-current-section=\"weather\"] + [data-current-section=\"electricity\"]')\n  ).toHaveCount(1);"
          if old_order in text:
              text = text.replace(old_order, new_order, 1)
          elif new_order not in text:
              raise SystemExit('Current section-order assertion did not match expected old or new state')
          regression.write_text(text)

          markets = Path('tests/e2e/current-markets.spec.ts')
          text = markets.read_text()

          old_pointer = """  await euriborSparkline.scrollIntoViewIfNeeded();
  const euriborBox = await euriborSparkline.boundingBox();
  expect(euriborBox).not.toBeNull();
  if (euriborBox) {
    await page.mouse.move(
      euriborBox.x + euriborBox.width / 2,
      euriborBox.y + euriborBox.height / 2
    );
  }
"""
          new_pointer = """  await euriborSparkline.scrollIntoViewIfNeeded();
  const euriborBox = await euriborSparkline.boundingBox();
  expect(euriborBox).not.toBeNull();
  if (euriborBox) {
    const clientX = euriborBox.x + euriborBox.width / 2;
    const clientY = euriborBox.y + euriborBox.height / 2;
    await euriborSparkline.dispatchEvent('pointerdown', {
      pointerType: 'touch',
      pointerId: 17,
      isPrimary: true,
      clientX,
      clientY,
    });
    await euriborSparkline.dispatchEvent('pointerup', {
      pointerType: 'touch',
      pointerId: 17,
      isPrimary: true,
      clientX,
      clientY,
    });
  }
"""
          if old_pointer in text:
              text = text.replace(old_pointer, new_pointer, 1)
          elif new_pointer not in text:
              raise SystemExit('Markets pointer interaction block did not match expected old or new state')

          old_test = "test('Current places Markets performance above electricity', async ({ page }) => {"
          new_test = "test('Current keeps Weather, Electricity and Markets in the intended order', async ({ page }) => {"
          if old_test in text:
              text = text.replace(old_test, new_test, 1)
          elif new_test not in text:
              raise SystemExit('Markets section-order test title did not match expected old or new state')

          old_module_order = """  const moduleOrder = await page.evaluate(() =>
    [...document.querySelectorAll('[data-current-markets], [data-current-electricity]')].map((element) =>
      element.hasAttribute('data-current-markets') ? 'markets' : 'electricity'
    )
  );

  expect(moduleOrder).toEqual(['markets', 'electricity']);
"""
          new_module_order = """  const moduleOrder = await page.evaluate(() =>
    [...document.querySelectorAll('[data-current-section]')].map((element) =>
      element.getAttribute('data-current-section')
    )
  );

  expect(moduleOrder).toEqual(['weather', 'electricity', 'markets']);
"""
          if old_module_order in text:
              text = text.replace(old_module_order, new_module_order, 1)
          elif new_module_order not in text:
              raise SystemExit('Markets module-order assertion did not match expected old or new state')
          markets.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Static checks
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Full browser regression suite
        run: npm run test:e2e

      - name: Commit repaired tests
        run: |
          if git diff --quiet -- tests/e2e/current-regression.spec.ts tests/e2e/current-markets.spec.ts; then
            echo "Tests already repaired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/current-regression.spec.ts tests/e2e/current-markets.spec.ts
          git commit -m "Align Current regression tests with current layout"
          git push origin HEAD:${{ github.head_ref }}
