name: Trigger WORK_TEST publish

on:
  push:
    branches:
      - ops/machine-publish
    paths:
      - .github/work-test-publish-request.json

permissions:
  contents: read
  actions: write

concurrency:
  group: trigger-work-test-publish
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require trusted request push
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF_FULL: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_NAME" == "push" ]]
          [[ "$REPOSITORY" == "aapojohannespihkala-lgtm/aapopihkala-fi" ]]
          [[ "$REF_FULL" == "refs/heads/ops/machine-publish" ]]
          [[ "$ACTOR" == "aapojohannespihkala-lgtm" ]]
          [[ "$ACTOR_ID" == "322566438" ]]
          [[ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]
          [[ -n "$AFTER_SHA" ]]

      - name: Checkout exact request commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require request-only commit scope
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed_files < <(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")
          [[ ${#changed_files[@]} -eq 1 ]]
          [[ "${changed_files[0]}" == ".github/work-test-publish-request.json" ]]

      - name: Validate publish request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          python3 - ".github/work-test-publish-request.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import re
          import sys

          request_path, output_path = sys.argv[1:]
          with open(request_path, "r", encoding="utf-8") as handle:
              payload = json.load(handle)

          if set(payload) != {"candidate", "requestId"}:
              raise SystemExit("publish request must contain exactly candidate and requestId")

          candidate = payload.get("candidate")
          request_id = payload.get("requestId")
          if not isinstance(candidate, str) or not re.fullmatch(r"[a-z0-9][a-z0-9-]{0,127}", candidate):
              raise SystemExit("invalid candidate format")
          if not isinstance(request_id, str) or not re.fullmatch(r"[A-Za-z0-9._:-]{1,128}", request_id):
              raise SystemExit("invalid requestId format")

          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write(f"candidate={candidate}\n")
              handle.write(f"request_id={request_id}\n")
          PY

      - name: Dispatch canonical publisher on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.request.outputs.candidate }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/publish-work-test-dispatch.json"
          python3 - "$CANDIDATE" "$payload" <<'PY'
          import json
          import sys

          candidate, path = sys.argv[1:]
          with open(path, "w", encoding="utf-8") as handle:
              json.dump({"ref": "main", "inputs": {"candidate": candidate}}, handle)
          PY

          gh api --method POST             "/repos/${GITHUB_REPOSITORY}/actions/workflows/publish-work-test.yml/dispatches"             --input "$payload"

          rm -f "$payload"
          echo "Dispatched canonical Publish WORK_TEST request $REQUEST_ID for $CANDIDATE on main."
