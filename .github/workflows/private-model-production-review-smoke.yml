  # Separate manual read gate: it reuses the existing targets client and
  # viewer-probe identity, does not repeat the already proven scene67 render,
  # and never enables the Worker or appends an observation to native G2.
  verify-g2-readiness:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.probe_mode == 'g2-readiness'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CF_ACCESS_VIEWER_PROBE_CLIENT_ID: ${{ secrets.CF_ACCESS_VIEWER_PROBE_CLIENT_ID }}
      CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET: ${{ secrets.CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Read native G2 readiness without writing
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { createP137EG2WorkerClient } from './src/scripts/privateModelP137EG2WorkerClient.mjs';
          import { p137EG2ReadinessFailureCodes } from './src/scripts/privateModelP137EG2WorkerClient.mjs';
          
          // A readiness GET cannot author a placement or prove persistence.
          const origin = 'https://aapopihkala.fi';
          const targetUrl = origin + '/private-model/review-placement/g2/targets';
          const expectedIds = [
            'D1F_USER_CURRENT_DOOR_A', 'D1F_USER_CURRENT_DOOR_B',
            'D_THEMO_CURRENT_BATHROOM_01', 'D_THEMO_CURRENT_BEDROOM_01',
            'D_THEMO_CURRENT_LOBBY_01',
          ].sort();
          const evidence = {
            probe: 'P137E_NATIVE_G2_READINESS_GET_V1',
            readyForSaveVerification: false,
            authenticatedTargetsReadVerified: false,
            targetCount: 0,
            httpStatus: null,
            nativeG2WriteVerified: false,
            independentObservationGetVerified: false,
            humanReview: 'NOT_RUN',
            publishToCURRENT: false,
          };
          try {
            const clientId = process.env.CF_ACCESS_VIEWER_PROBE_CLIENT_ID;
            const clientSecret = process.env.CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET;
            if (!clientId || !clientSecret) throw new Error('PROBE_CREDENTIALS_MISSING');
            const client = createP137EG2WorkerClient({
              origin,
              canReview: () => true,
              requestTimeoutMs: 15000,
              fetcher: async (url, options) => {
                if (url !== targetUrl || options.method !== 'GET' || options.body !== undefined) {
                  throw new Error('READINESS_GET_ONLY');
                }
                const response = await fetch(url, {
                  ...options,
                  headers: {
                    'CF-Access-Client-Id': clientId,
                    'CF-Access-Client-Secret': clientSecret,
                    Accept: 'application/json',
                  },
                });
                evidence.httpStatus = response.status;
                return response;
              },
            });
            const result = await client.targets();
            const ids = result.targets.map(target => target.targetId).sort();
            if (JSON.stringify(ids) !== JSON.stringify(expectedIds) ||
                !result.targets.every(target => target.apartment === 'D' &&
                  target.floor === '1F' && target.coordinateFrame === 'YLIS-G1-LOCAL')) {
              throw new Error('NATIVE_TARGET_SET_MISMATCH');
            }
            evidence.targetCount = ids.length;
            evidence.authenticatedTargetsReadVerified = true;
            evidence.readyForSaveVerification = true;
          } catch (error) {
            // Never persist response text, cookies, credentials, native G2 prose or
            // arbitrary upstream errors. A hidden 404 does not identify its root cause.
            const allowedCodes = new Set([
              'PROBE_CREDENTIALS_MISSING', 'READINESS_GET_ONLY',
              'NATIVE_TARGET_SET_MISMATCH', 'P137E_G2_UNAVAILABLE',
              'P137E_G2_REDIRECT_REJECTED', 'P137E_G2_RESPONSE_TYPE_INVALID',
              'P137E_G2_RESPONSE_TOO_LARGE', 'P137E_G2_RESPONSE_EMPTY',
              'P137E_G2_RESPONSE_INVALID', 'P137E_G2_REQUEST_TIMEOUT',
              'P137E_G2_TARGET_EVIDENCE_INVALID',
            ]);
            evidence.failure = allowedCodes.has(error?.message)
              ? error.message : 'P137E_G2_READINESS_FAILED';
            if (p137EG2ReadinessFailureCodes.includes(error?.g2FailureCode)) {
              evidence.failureCode = error.g2FailureCode;
            }
          }
          mkdirSync('playwright-artifacts', { recursive: true });
          writeFileSync('playwright-artifacts/p137e-native-g2-readiness.json',
            JSON.stringify(evidence, null, 2));
          console.log(JSON.stringify(evidence));
          if (!evidence.readyForSaveVerification) process.exitCode = 1;
          NODE
      - name: Upload sanitized G2 readiness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-model-g2-readiness
          path: playwright-artifacts/p137e-native-g2-readiness.json
          if-no-files-found: ignore
          retention-days: 7

  # Authentic production verification of exactly the three existing G2
  # WORK_TEST observations. No POST, no duplicate records, no model approval.
  # This is a distinct, explicit main-only workflow_dispatch gate.
  verify-g2-observations-readback:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.probe_mode == 'g2-records-readback'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CF_ACCESS_VIEWER_PROBE_CLIENT_ID: ${{ secrets.CF_ACCESS_VIEWER_PROBE_CLIENT_ID }}
      CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET: ${{ secrets.CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Independently authenticate and read three existing G2 records
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { createP137EG2WorkerClient } from './src/scripts/privateModelP137EG2WorkerClient.mjs';

          const origin = 'https://aapopihkala.fi';
          const route = origin + '/private-model/review-placement/g2/observations/';
          const records = [
            { id: 'P137E_G2_2ea51c8886014d7abe51f4f7915da068',
              targetId: 'D_THEMO_CURRENT_LOBBY_01', xM: 3.73, yM: 5.12, heightM: 1.48 },
            { id: 'P137E_G2_ad31cfc5497548a98e4dd400f1acdc48',
              targetId: 'D_THEMO_CURRENT_BEDROOM_01', xM: 3.69, yM: 5.03, heightM: 1.48 },
            { id: 'P137E_G2_11262097b6124ba68ea4fdbdbc0bed32',
              targetId: 'D_THEMO_CURRENT_BATHROOM_01', xM: 4.88, yM: 5.03, heightM: 1.40 },
          ];
          const allowedUrls = new Set(records.map(record => route + record.id));
          const evidence = {
            probe: 'P137E_EXISTING_G2_OBSERVATIONS_READBACK_V1',
            requiredRecordCount: 3,
            verifiedRecordCount: 0,
            authenticatedWorkerGetVerified: false,
            nativeG2WriteAttempted: false,
            newObservationCreated: false,
            originalWorkTestOnly: true,
            humanReview: 'NOT_RUN',
            publishToCURRENT: false,
          };
          try {
            const clientId = process.env.CF_ACCESS_VIEWER_PROBE_CLIENT_ID;
            const clientSecret = process.env.CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET;
            if (!clientId || !clientSecret) throw new Error('PROBE_CREDENTIALS_MISSING');

            const client = createP137EG2WorkerClient({
              origin,
              canReview: () => true,
              requestTimeoutMs: 15000,
              fetcher: async (url, options) => {
                if (!allowedUrls.has(url) ||
                    options.method !== 'GET' ||
                    options.body !== undefined) {
                  throw new Error('READBACK_GET_ONLY');
                }
                // A read-only probe identity MUST NOT gain write permissions.
                // Never export tokens, response headers or native G2 payloads.
                return fetch(url, {
                  ...options,
                  headers: {
                    'CF-Access-Client-Id': clientId,
                    'CF-Access-Client-Secret': clientSecret,
                    Accept: 'application/json',
                  },
                });
              },
            });

            for (const record of records) {
              // This is a NEW authenticated Worker GET for an EXISTING exact
              // record, not a replay of the original direct Docs write.
              const actual = await client.readback(record.id);
              const p = actual.payload;
              const a = p.anchor, observed = p.observation;
              if (actual.recordId !== record.id ||
                  a?.targetId !== record.targetId ||
                  a?.apartment !== 'D' || a?.floor !== '1F' ||
                  a?.coordinateFrame !== 'YLIS-G1-LOCAL' ||
                  a?.xM !== record.xM || a?.yM !== record.yM ||
                  a?.approximate !== true || a?.exactXY !== false ||
                  observed?.anchor?.targetId !== record.targetId ||
                  observed?.anchor?.xM !== record.xM ||
                  observed?.anchor?.yM !== record.yM ||
                  observed?.height?.aboveFinishedFloorM !== record.heightM ||
                  observed?.height?.zM !== null ||
                  observed?.verifiedWallSide !== false ||
                  p.resolution?.status !== 'UNMAPPED' ||
                  p.resolution?.reason !== 'NO_APPROVED_HOST' ||
                  p.resolution?.proposal !== null ||
                  p.persisted !== false || p.humanReview !== 'NOT_RUN' ||
                  p.currentGeometry !== false || p.canonical !== false ||
                  p.asBuilt !== false) {
                throw new Error('RECORD_SOURCE_MISMATCH');
              }
              evidence.verifiedRecordCount += 1;
            }
            evidence.authenticatedWorkerGetVerified =
              evidence.verifiedRecordCount === evidence.requiredRecordCount;
          } catch {
            // Sanitized, deliberately non-specific: never log Docs content,
            // Access headers, response bodies or upstream exception strings.
            evidence.failure = 'WORKER_READBACK_NOT_VERIFIED';
          }
          mkdirSync('playwright-artifacts', { recursive: true });
          writeFileSync('playwright-artifacts/p137e-g2-records-readback.json',
            JSON.stringify(evidence, null, 2));
          console.log(JSON.stringify(evidence));
          if (!evidence.authenticatedWorkerGetVerified) process.exitCode = 1;
          NODE
      - name: Upload sanitized existing-record readback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-model-g2-existing-records-readback
          path: playwright-artifacts/p137e-g2-records-readback.json
          if-no-files-found: ignore
          retention-days: 7


  # Main-only, deliberately separate from the previously approved P137E
  # scene67 housing proof and R1125 smoke. This work-test variant is not
  # CURRENT or HUMAN_REVIEW. Never run with PR-provided Access secrets.
  verify-p137e-walls-render:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.probe_mode == 'p137e-walls-render'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCESS_VIEWER_PROBE_CLIENT_ID: ${{ secrets.CF_ACCESS_VIEWER_PROBE_CLIENT_ID }}
      CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET: ${{ secrets.CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Authenticate exact scene69 and verify real canvas changes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { chromium } from '@playwright/test';
          import {
            P137E_SCENE67_PRODUCTION_SMOKE_ID as candidateId,
            P137E_SCENE67_PRODUCTION_SMOKE_REVIEW_ID as reviewId,
            P137E_SCENE67_PRODUCTION_GLB_URL as originalAsset,
            P137E_SCENE67_EXPECTED_GLB_BYTES as expectedBytes,
            P137E_SCENE67_EXPECTED_GLB_SHA256 as expectedHash,
          } from './src/scripts/privateModelP137EScene67ProductionSmokeGuard.mjs';
          import {
            P137E_MEASURED_WALL_METRICS_MM as measured,
            P137E_THREE_CORNER_MEASURED_SCENE_INDEX as sceneIndex,
          } from './src/scripts/privateModelP137EFieldMeasuredWallRuntime.mjs';

          // BEGIN wall stage helpers: exercised as executable functions by CI.
          function withWallStageDeadline(phase, run, timeoutMs) {
            if (!/^[A-Z_]+$/.test(phase) || typeof run !== 'function' ||
                !Number.isSafeInteger(timeoutMs) || timeoutMs < 1 || timeoutMs > 45000) {
              throw Error('Invalid fixed wall stage deadline');
            }
            let timer;
            const expired = new Promise((_, reject) => {
              timer = setTimeout(() => {
                const failure = new Error('Wall stage deadline exceeded');
                failure.code = 'WALL_STAGE_TIMEOUT';
                reject(failure);
              }, timeoutMs);
            });
            return Promise.race([Promise.resolve().then(run), expired])
              .finally(() => clearTimeout(timer));
          }
          // END wall stage deadline helper.
          function sanitizedWallStageFailure(error, phase) {
            const phases = ['PREFLIGHT', 'BROWSER_START', 'VIEWER_HTTP',
              'AUTOLOAD_DATASET', 'SOURCE_GLB_BODY', 'CANVAS_BEFORE',
              'CANVAS_AFTER', 'RGBA_EVALUATION', 'IDENTITY_READBACK'];
            return {
              result: 'FAIL',
              phase: phases.includes(phase) ? phase : 'PREFLIGHT',
              failureCode: error && error.code === 'WALL_STAGE_TIMEOUT'
                ? 'WALL_STAGE_DEADLINE_EXCEEDED' : 'WALL_PROBE_REJECTED',
              // Never serialize error text, stack, headers, URLs or credentials.
              threeIndividualCornerRenderedRoisVerified: false,
              measuredWallIndividualRoiVerified: false,
              actualHumanVisualReview: false,
              humanReview: 'NOT_RUN', current: false, asBuilt: false,
            };
          }
          // END wall safe failure helper.
          fs.mkdirSync('playwright-artifacts', {recursive:true});
          const evidence = {
            probe:'P137E_SCENE69_AUTHENTICATED_RENDER_V2', result:'RUNNING', phase:'PREFLIGHT',
            sourceGlbBytes:expectedBytes,sourceGlbSha256:expectedHash,reviewId,candidateId,
            originalSourceAutoloadResponseVerified:false,
            sceneIndex,workTestOnly:true,current:false,asBuilt:false,humanReview:'NOT_RUN',
            measured,sourceCornerCount:3,cornerWidthMm:40,
            screenshotBeforeAfterOrbitPixels:null,
            threeIndividualCornerRenderedRoisVerified:false,
            measuredWallIndividualRoiVerified:false,
            actualHumanVisualReview:false,
          };
          const writeEvidence = () => fs.writeFileSync(
            'playwright-artifacts/p137e-walls-scene69-production.json',
            JSON.stringify(evidence,null,2));
          let browser;
          try {
            const clientId = process.env.CF_ACCESS_VIEWER_PROBE_CLIENT_ID;
            const clientSecret = process.env.CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET;
            if (!clientId || !clientSecret) throw Error('Missing dedicated viewer probe secrets');
            const viewerSource = fs.readFileSync('src/pages/private-model/index.astro', 'utf8');
            const variants = [...viewerSource.matchAll(/const p137eThreeCornerMeasuredVariant = '([a-z0-9-]+)'/g)];
            if (variants.length !== 1 || sceneIndex !== 69 ||
                measured.kphSideLength !== 960 || measured.wcSideVisible !== 710 ||
                measured.thickness !== 205 || measured.lobbyClearGap !== 1020) {
              throw Error('P137E scene69 source identity or measured contract changed');
            }
            const reviewUrl = new URL('https://aapopihkala.fi/private-model/');
            reviewUrl.searchParams.set('review', reviewId);
            reviewUrl.searchParams.set('wallMetric', variants[0][1]);
            const expected = {
              workTestReviewAutoload: 'true',
              modelSource: 'work-test',
              workTestReviewCandidate: candidateId,
              workTestReviewMode: reviewId + '-field-measured-three-source-corners',
              p137eSceneIndex: String(sceneIndex),
              p137eMeasuredWallMetricId: variants[0][1],
              p137eSourceCornerGapsClosed: '3',
              p137eSourceCornerPatchWidthMm: '40',
              p137eSourceCornersPhysicalThicknessVerified: 'false',
              p137eMeasuredWallKphLengthMm: String(measured.kphSideLength),
              p137eMeasuredWallWcVisibleMm: String(measured.wcSideVisible),
              p137eMeasuredWallThicknessMm: String(measured.thickness),
              p137eMeasuredWallLobbyGapMm: String(measured.lobbyClearGap),
              p137eMeasuredWallGlobalXYBinding: 'CONDITIONAL_UNVERIFIED',
              p137eWorkTestOnly: 'true',
              p137eCurrentClaim: 'false',
              p137eCanonical: 'false',
              p137eAsBuiltClaim: 'false',
              p137eHumanReview: 'NOT_RUN',
            };
            evidence.phase = 'BROWSER_START';
            browser = await withWallStageDeadline('BROWSER_START',
              () => chromium.launch({headless:true}), 15000);
            const context = await browser.newContext({viewport:{width:1536,height:900}});
            await context.route('https://aapopihkala.fi/**', route =>
              route.continue({headers:{...route.request().headers(),
                'cf-access-client-id':clientId,
                'cf-access-client-secret':clientSecret}}));
            const page = await context.newPage();
            const sourceResponses = [];
            page.on('response', response => {
              if (response.url() === originalAsset) sourceResponses.push(response);
            });
            evidence.phase = 'VIEWER_HTTP';
            const result = await withWallStageDeadline('VIEWER_HTTP',
              () => page.goto(reviewUrl.toString(), {
                waitUntil:'domcontentloaded',timeout:40000,
              }), 45000);
            if (result?.status() !== 200) throw Error('P137E production viewer HTTP != 200');
            const finalUrl = new URL(page.url());
            if (finalUrl.origin !== reviewUrl.origin ||
                finalUrl.pathname !== reviewUrl.pathname ||
                finalUrl.searchParams.get('review') !== reviewId ||
                finalUrl.searchParams.get('wallMetric') !== variants[0][1] ||
                [...finalUrl.searchParams.keys()].length !== 2) {
              throw Error('P137E scene69 review URL lost exact target');
            }
            evidence.phase = 'AUTOLOAD_DATASET';
            await page.waitForFunction(required => {
              const el = document.querySelector('#private-model-canvas');
              return el instanceof HTMLCanvasElement &&
                Object.entries(required).every(([key,value])=>el.dataset[key]===value);
            }, expected, {timeout:35000});
            const canvas = page.locator('#private-model-canvas');
            const dataset = await canvas.evaluate(el=>({...el.dataset}));
            if (sourceResponses.length !== 1) {
              throw Error('Expected one immutable scene67 GLB autoload response');
            }
            const assetResponse = sourceResponses[0];
            evidence.phase = 'SOURCE_GLB_BODY';
            const glb = await withWallStageDeadline('SOURCE_GLB_BODY',
              () => assetResponse.body(), 25000);
            const originalVerified = assetResponse.status() === 200 &&
              glb.length === expectedBytes &&
              createHash('sha256').update(glb).digest('hex') === expectedHash;
            if (!originalVerified) throw Error('Original scene67 GLB bytes do not match raw Drive identity');
            evidence.originalSourceAutoloadResponseVerified = true;
            const box = await canvas.boundingBox();
            if (!box || box.width < 256 || box.height < 256) throw Error('Canvas rectangle is not usable');
            await page.waitForTimeout(400);
            evidence.phase = 'CANVAS_BEFORE';
            const before = await withWallStageDeadline('CANVAS_BEFORE',
              () => page.screenshot({clip:box,animations:'disabled',timeout:10000,
                path:'playwright-artifacts/p137e-walls-scene69-before.png'}), 12000);
            await page.mouse.move(box.x+box.width*.48,box.y+box.height*.5);
            await page.mouse.wheel(0,-460);
            await page.waitForTimeout(600);
            evidence.phase = 'CANVAS_AFTER';
            const after = await withWallStageDeadline('CANVAS_AFTER',
              () => page.screenshot({clip:box,animations:'disabled',timeout:10000,
                path:'playwright-artifacts/p137e-walls-scene69-after.png'}), 12000);
            evidence.phase = 'RGBA_EVALUATION';
            const pixels = await withWallStageDeadline('RGBA_EVALUATION',
              () => page.evaluate(async imgs => {
              const decode = async b64 => {
                const img = new Image();img.src='data:image/png;base64,'+b64;
                await img.decode();
                const c=document.createElement('canvas');
                c.width=img.width;c.height=img.height;
                const ctx=c.getContext('2d');
                if (!ctx) throw Error('Cannot decode screenshot for RGBA');
                ctx.drawImage(img,0,0);
                return {w:c.width,h:c.height,rgba:ctx.getImageData(0,0,c.width,c.height).data};
              };
              const a=await decode(imgs[0]),b=await decode(imgs[1]);
              if(a.w!==b.w || a.h!==b.h || a.w<256 || a.h<256)throw Error('PNG pixel dimensions');
              const bg=[a.rgba[0],a.rgba[1],a.rgba[2]];
              let filled=0,changed=0;
              for(let i=0;i<a.rgba.length;i+=4){
                if(Math.abs(a.rgba[i]-bg[0])+Math.abs(a.rgba[i+1]-bg[1])+
                   Math.abs(a.rgba[i+2]-bg[2])>42)filled++;
                if(Math.abs(a.rgba[i]-b.rgba[i])+Math.abs(a.rgba[i+1]-b.rgba[i+1])+
                   Math.abs(a.rgba[i+2]-b.rgba[i+2])>42)changed++;
              }
              return {width:a.w,height:a.h,nonBackgroundPixels:filled,changedPixels:changed};
            },[before.toString('base64'),after.toString('base64')]), 10000);
            if (pixels.nonBackgroundPixels < 1500 || pixels.changedPixels < 750) {
              throw Error('Scene69 real canvas did not meet hard pixel floor');
            }
            evidence.screenshotBeforeAfterOrbitPixels = pixels;
            evidence.phase = 'IDENTITY_READBACK';
            const afterDataset = await withWallStageDeadline('IDENTITY_READBACK',
              () => canvas.evaluate(el=>({...el.dataset})), 10000);
            if (Object.entries(expected).some(([key,value])=>afterDataset[key]!==value))
              throw Error('Scene69 identity/promotion state drifted during orbit');
            evidence.result = 'PASS';
            evidence.phase = 'COMPLETE';
            writeEvidence();
            console.log(JSON.stringify({probe:evidence.probe,sourceGlbVerified:true,
              sceneIndex,renderPixels:pixels,threeCornerRoiGate:'NOT_RUN'}));
          } catch (error) {
            const failure = sanitizedWallStageFailure(error, evidence.phase);
            Object.assign(evidence, failure);
            writeEvidence();
            console.error(JSON.stringify({probe:evidence.probe,...failure}));
            process.exitCode = 1;
          } finally {
            if (browser) {
