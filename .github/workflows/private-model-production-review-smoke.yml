
name: Private model production review smoke

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/private-model-production-review-smoke.yml
  workflow_dispatch:
    inputs:
      probe_mode:
        description: Full render, automatic R1125 drainage preset, or read-only G2 checks
        required: true
        type: choice
        default: full-render
        options:
          - full-render
          - r1125-render
          - p137e-walls-render
          - d1f-combined-pixels
          - d1f-measured-pixels
          - g2-readiness
          - g2-records-readback
      measured_candidate:
        description: Exact D1F source and its complete target set
        required: true
        type: choice
        default: d1f-measured-wall-140-100-2350-b710-basin-20261014
        options:
          - d1f-measured-wall-140-100-2350-b710-basin-20261014
          - d1f-finished-face-2360-wall-basin-20261014
          - d1f-four-review-corrections-20261014
          - d1f-bathroom-surfaces-cabinet-20261015
          - d1f-wc-enclosure-themos-20261015
      review_id:
        description: Full-render review ID; r1125-render fills this automatically
        required: true
        type: string
        default: "p137e-d1f-three-wall-mounted-themos-review"
      candidate_id:
        description: Full-render candidate ID; r1125-render fills this automatically
        required: true
        type: string
        default: "p137e-d1f-three-wall-mounted-themos"
      expected_dataset_json:
        description: Full-render expected canvas JSON; r1125-render derives this from source constants
        required: true
        type: string
        default: '{"p137eSceneIndex":"67","p137eFocusedRootCount":"1","p137eOriginalSourceWallNode":"798","p137eOriginalSourceWallMesh":"406","p137eWallMountedThemoCount":"3","p137eRoomFootprintCount":"0","p137ePresentationOnly":"true","p137eWorkTestOnly":"true","p137eExactXYClaim":"false","p137eExactZClaim":"false","p137eCurrentClaim":"false","p137eCanonical":"false","p137eAsBuiltClaim":"false","p137eHumanReview":"NOT_RUN","p137eReviewCameraMode":"ORTHOGRAPHIC_SOURCE_WALL_D1F_TOP","contentFloor":"1F","contentScene":"full-model"}'
      min_non_background_pixels:
        description: Minimum rendered-scene pixel count
        required: true
        default: "1500"
        type: string
      min_changed_pixels:
        description: Minimum orbit-responsive pixel count
        required: true
        default: "750"
        type: string

permissions:
  contents: read

# PR contract checks must never cancel an authenticated main-only production run.
# A second manual run queues rather than cancelling the first incomplete proof.
concurrency:
  group: private-model-production-review-smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract-regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      R1090_REVIEW_ID: m5a-z2d-r1090-well-top-ground-surface-review
      R1090_CANDIDATE_ID: m5a-z2d-r1090-well-top-ground-surface
      R1090_EXPECTED_DATASET_JSON: '{"m5aZ2ReviewState":"ready","m5aReviewTargetRenderableCount":"13","m5aReviewExpectedTargetRenderableCount":"13","m5aReviewWellMarkerCount":"4","m5aReviewRouteCount":"7","m5aReviewUnresolvedBoundaryCount":"2","m5aReviewSemanticViolationCount":"0","m5aReviewCameraFocusApplied":"true"}'

    steps:
      - uses: actions/checkout@v4

      - name: Verify secretless R1090 baseline and workflow safety contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          baseline = json.loads(os.environ["R1090_EXPECTED_DATASET_JSON"])
          if not isinstance(baseline, dict) or not baseline:
              raise SystemExit("R1090 baseline dataset contract must be a non-empty object")

          required_r1090 = {
              "m5aZ2ReviewState": "ready",
              "m5aReviewTargetRenderableCount": "13",
              "m5aReviewExpectedTargetRenderableCount": "13",
              "m5aReviewWellMarkerCount": "4",
              "m5aReviewRouteCount": "7",
              "m5aReviewUnresolvedBoundaryCount": "2",
              "m5aReviewSemanticViolationCount": "0",
              "m5aReviewCameraFocusApplied": "true",
          }
          if baseline != required_r1090:
              raise SystemExit("R1090 regression baseline changed unexpectedly")

          workflow = Path(
              ".github/workflows/private-model-production-review-smoke.yml"
          ).read_text(encoding="utf-8")

          contract_marker = "  contract-regression:\n"
          production_marker = "  verify-production:\n"
          if contract_marker not in workflow or production_marker not in workflow:
              raise SystemExit("Expected workflow jobs are missing")

          contract_section = workflow.split(contract_marker, 1)[1].split(
              production_marker, 1
          )[0]
          production_section = workflow.split(production_marker, 1)[1]

          secret_binding_prefix = " $" + "{{ sec" + "rets."
          for variable in (
              "CF_ACCESS_VIEWER_PROBE_CLIENT_ID",
              "CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET",
          ):
              if variable + ":" + secret_binding_prefix in contract_section:
                  raise SystemExit(
                      "pull_request contract job must not bind viewer-probe secrets"
                  )

          required_production_snippets = [
              "github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'",
              "CF_ACCESS_VIEWER_PROBE_CLIENT_ID",
              "CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET",
              "https://aapopihkala.fi/private-model/",
              "MIN_NON_BACKGROUND_PIXELS_HARD_FLOOR: '1500'",
              "MIN_CHANGED_PIXELS_HARD_FLOOR: '750'",
              "workTestReviewAutoload === 'true'",
              "modelSource === 'work-test'",
              "workTestReviewMode === expectedReviewId",
              "workTestReviewCandidate === expectedCandidateId",
              "detectP186FX4CyanTargetComponents",
              "X4 requires exactly 3 separately rendered cyan targets",
              "X4 original source wall 798 review context missing",
              "detectP186FX4OriginalGreenWallPixels",
              "p137eScene67TwoFaceEvidence",
              "p137e-scene67-south.png",
              "P137E original green wall not rendered",
              "X4 original green wall not rendered",
              "detectM5BR1109CyanLocatorComponents",
              "M5B R1109 requires 5 rendered cyan locators",
              "M5B R1109 screenshot detector returned no pixel result",
              "pointerButton = isX4Themo ? 'right' : 'left'",
          ]
          missing = [
              snippet
              for snippet in required_production_snippets
              if snippet not in production_section
          ]
          if missing:
              raise SystemExit(
                  "Production safety contract missing: " + ", ".join(missing)
              )

          print(
              json.dumps(
                  {
                      "reviewId": os.environ["R1090_REVIEW_ID"],
                      "candidateId": os.environ["R1090_CANDIDATE_ID"],
                      "datasetKeys": sorted(baseline),
                      "pullRequestSecrets": False,
                      "hardFloors": {
                          "nonBackgroundPixels": 1500,
                          "changedPixels": 750,
                      },
                  }
              )
          )
          PY

  verify-production:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.probe_mode == 'full-render' || inputs.probe_mode == 'r1125-render')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REVIEW_BASE_URL: https://aapopihkala.fi/private-model/
      REVIEW_ID: ${{ inputs.review_id }}
      CANDIDATE_ID: ${{ inputs.candidate_id }}
      EXPECTED_DATASET_JSON: ${{ inputs.expected_dataset_json }}
      REQUESTED_MIN_NON_BACKGROUND_PIXELS: ${{ inputs.min_non_background_pixels }}
      REQUESTED_MIN_CHANGED_PIXELS: ${{ inputs.min_changed_pixels }}
      MIN_NON_BACKGROUND_PIXELS_HARD_FLOOR: '1500'
      MIN_CHANGED_PIXELS_HARD_FLOOR: '750'
      CF_ACCESS_VIEWER_PROBE_CLIENT_ID: ${{ secrets.CF_ACCESS_VIEWER_PROBE_CLIENT_ID }}
      CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET: ${{ secrets.CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Resolve canonical R1125 render preset
        if: inputs.probe_mode == 'r1125-render'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { R1125_ORIGINAL_GLB } from './src/scripts/privateModelM5AR1125OriginalGlbGuard.mjs';
          import { m5aR1125SourcePixelKinds } from './src/scripts/privateModelM5AR1125SourceRoiPixelProof.mjs';

          const routing = readFileSync('src/scripts/privateModelWorkTest.ts', 'utf8');
          const ids = [...routing.matchAll(/^export const m5aZ2R1125CandidateId = '([a-z0-9-]+)';$/gm)];
          if (ids.length !== 1 || !routing.includes('export const m5aZ2R1125ReviewId = `${m5aZ2R1125CandidateId}-review`;')) {
            throw new Error('R1125 canonical identity declarations changed; do not guess a review alias');
          }
          const kinds = Object.values(m5aR1125SourcePixelKinds);
          if (kinds.length !== R1125_ORIGINAL_GLB.sourceTargetCount ||
              kinds.some(kind => !['wellGray', 'routeCyan', 'boundaryYellow'].includes(kind))) {
            throw new Error('R1125 source role contract mismatch');
          }
          const count = kind => String(kinds.filter(value => value === kind).length);
          const targets = String(kinds.length);
          const expected = {
            m5aZ2ReviewState: 'ready',
            m5aReviewTargetRenderableCount: targets,
            m5aReviewExpectedTargetRenderableCount: targets,
            m5aReviewWellMarkerCount: count('wellGray'),
            m5aReviewRouteCount: count('routeCyan'),
            m5aReviewUnresolvedBoundaryCount: count('boundaryYellow'),
            m5aReviewSemanticViolationCount: '0',
            m5aR1125SourceSceneIndex: String(R1125_ORIGINAL_GLB.sceneIndex),
            m5aR1125SourceContract: 'G2_R1125',
            m5aHumanReview: 'NOT_RUN',
            m5aR1125HumanReview: 'NOT_RUN',
          };
          const candidate = ids[0][1];
          const values = {
            REVIEW_ID: candidate + '-review', CANDIDATE_ID: candidate,
            EXPECTED_DATASET_JSON: JSON.stringify(expected),
          };
          if (!process.env.GITHUB_ENV) throw new Error('GitHub step environment file missing');
          appendFileSync(process.env.GITHUB_ENV,
            Object.entries(values).map(([key, value]) => key + '=' + value).join('\n') + '\n');
          console.log('R1125 preset resolved from canonical registry and source roles');
          NODE

      - name: Validate generic production review inputs and hard floors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re

          review_id = os.environ["REVIEW_ID"]
          candidate_id = os.environ["CANDIDATE_ID"]
          base_url = os.environ["REVIEW_BASE_URL"]

          if base_url != "https://aapopihkala.fi/private-model/":
              raise SystemExit("Production viewer host/path must remain fixed")

          id_pattern = re.compile(r"^[A-Za-z0-9._-]+$")
          if not review_id or not id_pattern.fullmatch(review_id):
              raise SystemExit("review_id is empty or contains unsupported characters")
          if not candidate_id or not id_pattern.fullmatch(candidate_id):
              raise SystemExit("candidate_id is empty or contains unsupported characters")

          try:
              expected_dataset = json.loads(os.environ["EXPECTED_DATASET_JSON"])
          except json.JSONDecodeError as exc:
              raise SystemExit("expected_dataset_json is invalid JSON") from exc

          if not isinstance(expected_dataset, dict) or not expected_dataset:
              raise SystemExit(
                  "expected_dataset_json must be a non-empty JSON object"
              )

          reserved_base_keys = {
              "workTestReviewAutoload",
              "modelSource",
              "workTestReviewMode",
              "workTestReviewCandidate",
          }
          overlap = reserved_base_keys.intersection(expected_dataset)
          if overlap:
              raise SystemExit(
                  "expected_dataset_json may only add candidate-specific requirements; "
                  "reserved base keys: " + ", ".join(sorted(overlap))
              )

          for key, value in expected_dataset.items():
              if not isinstance(key, str) or not key:
                  raise SystemExit("expected_dataset_json keys must be non-empty strings")
              if not isinstance(value, (str, int, float, bool)):
                  raise SystemExit(
                      "expected_dataset_json values must be scalar exact-match values"
                  )

          requested_non_background = int(
              os.environ["REQUESTED_MIN_NON_BACKGROUND_PIXELS"]
          )
          requested_changed = int(os.environ["REQUESTED_MIN_CHANGED_PIXELS"])
          floor_non_background = int(
              os.environ["MIN_NON_BACKGROUND_PIXELS_HARD_FLOOR"]
          )
          floor_changed = int(os.environ["MIN_CHANGED_PIXELS_HARD_FLOOR"])

          if requested_non_background < floor_non_background:
              raise SystemExit(
                  "min_non_background_pixels cannot be lower than hard floor "
                  + str(floor_non_background)
              )
          if requested_changed < floor_changed:
              raise SystemExit(
                  "min_changed_pixels cannot be lower than hard floor "
                  + str(floor_changed)
              )

          print(
              json.dumps(
                  {
                      "reviewId": review_id,
                      "candidateId": candidate_id,
                      "datasetKeys": sorted(expected_dataset),
                      "pixelThresholds": {
                          "nonBackgroundPixels": requested_non_background,
                          "changedPixels": requested_changed,
                      },
                      "hardFloors": {
                          "nonBackgroundPixels": floor_non_background,
                          "changedPixels": floor_changed,
                      },
                  }
              )
          )
          PY

      - name: Verify required viewer-probe service-token secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CF_ACCESS_VIEWER_PROBE_CLIENT_ID" ]] || { echo "Missing CF_ACCESS_VIEWER_PROBE_CLIENT_ID secret" >&2; exit 1; }
          [[ -n "$CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET" ]] || { echo "Missing CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET secret" >&2; exit 1; }

      - name: Classify authenticated production viewer response
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p playwright-artifacts
          # Raw cookies and redirect state must never enter the upload directory.
          response_tmp="$(mktemp -d .production-response.XXXXXX)"
          trap 'python3 -c "import shutil,sys; shutil.rmtree(sys.argv[1])" "$response_tmp"' EXIT

          curl \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 45 \
            --get \
            --data-urlencode "review=$REVIEW_ID" \
            --header "CF-Access-Client-Id: $CF_ACCESS_VIEWER_PROBE_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET" \
            --dump-header "$response_tmp/headers.txt" \
            --output playwright-artifacts/review-page.html \
            --write-out '%{http_code}\n%{content_type}\n%{redirect_url}\n' \
            "$REVIEW_BASE_URL" > "$response_tmp/meta.txt"

          python3 - "$response_tmp" <<'PY'
          import sys
          from pathlib import Path
          from urllib.parse import urlparse

          meta = Path(sys.argv[1], "meta.txt").read_text(
              encoding="utf-8",
              errors="replace",
          ).splitlines()
          status = int(meta[0]) if meta and meta[0].isdigit() else 0
          content_type = meta[1] if len(meta) > 1 else ""
          redirect_url = meta[2] if len(meta) > 2 else ""

          headers = Path(sys.argv[1], "headers.txt").read_text(
              encoding="utf-8",
              errors="replace",
          )
          body = Path("playwright-artifacts/review-page.html").read_text(
              encoding="utf-8",
              errors="replace",
          )

          location = ""
          for line in headers.splitlines():
              if line.lower().startswith("location:"):
                  location = line.split(":", 1)[1].strip()
                  break

          redirect_host = urlparse(redirect_url).hostname or ""
          location_host = urlparse(location).hostname or ""
          body_lower = body.lower()
          has_canvas = 'id="private-model-canvas"' in body
          has_access_marker = (
              "cloudflare access" in body_lower
              or "cloudflareaccess.com" in body_lower
              or "cf-access" in body_lower
          )

          if status == 200 and has_canvas:
              classification = "VIEWER_HTML"
          elif (
              300 <= status < 400
              or redirect_host.endswith("cloudflareaccess.com")
              or location_host.endswith("cloudflareaccess.com")
          ):
              classification = "ACCESS_REDIRECT"
          elif status in (401, 403):
              classification = "ACCESS_DENIED"
          elif status == 200 and has_access_marker:
              classification = "ACCESS_BODY"
          elif status == 200:
              classification = "NON_VIEWER_200_BODY"
          elif has_canvas:
              classification = "NON_200_VIEWER_BODY"
          else:
              classification = "UNCLASSIFIED_RESPONSE"

          print(f"response_status={status}")
          print(f"content_type={content_type or 'unknown'}")
          print(f"location_host={location_host or 'none'}")
          print(f"redirect_host={redirect_host or 'none'}")
          print(f"has_canvas={str(has_canvas).lower()}")
          print(f"has_access_marker={str(has_access_marker).lower()}")
          print(f"classification={classification}")

          Path("playwright-artifacts/review-response-classification.txt").write_text(
              "\n".join(
                  [
                      f"response_status={status}",
                      f"content_type={content_type or 'unknown'}",
                      f"location_host={location_host or 'none'}",
                      f"redirect_host={redirect_host or 'none'}",
                      f"has_canvas={str(has_canvas).lower()}",
                      f"has_access_marker={str(has_access_marker).lower()}",
                      f"classification={classification}",
                  ]
              )
              + "\n",
              encoding="utf-8",
          )

          if classification != "VIEWER_HTML":
              raise SystemExit(1)
          PY

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify exact autoload and rendered production canvas
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { chromium } from '@playwright/test';
          import { detectM5BR1109CyanLocatorComponents } from './src/scripts/privateModelR1109CyanLocatorProof.mjs';
          import { detectP186FX4CyanTargetComponents, detectP186FX4OriginalGreenWallPixels } from './src/scripts/privateModelP186FX4CyanPixelProof.mjs';
          import { buildM5AR1125BrowserScreenshotProofExpression } from './src/scripts/privateModelM5AR1125SourceRoiPixelProof.mjs';
          import { authenticateM5AR1125OriginalGlb, R1125_ORIGINAL_GLB } from './src/scripts/privateModelM5AR1125OriginalGlbGuard.mjs';
          import { inspectP137EScene67ProductionSmoke, inspectP137EScene67PublishedGlb, P137E_SCENE67_PRODUCTION_GLB_URL } from './src/scripts/privateModelP137EScene67ProductionSmokeGuard.mjs';

          const reviewBaseUrl = process.env.REVIEW_BASE_URL;
          const reviewId = process.env.REVIEW_ID;
          const candidateId = process.env.CANDIDATE_ID;
          const clientId = process.env.CF_ACCESS_VIEWER_PROBE_CLIENT_ID;
          const clientSecret = process.env.CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET;
          const expectedDatasetJson = process.env.EXPECTED_DATASET_JSON;
          const minNonBackgroundPixels = Number(
            process.env.REQUESTED_MIN_NON_BACKGROUND_PIXELS,
          );
          const minChangedPixels = Number(process.env.REQUESTED_MIN_CHANGED_PIXELS);
          const hardFloorNonBackground = Number(
            process.env.MIN_NON_BACKGROUND_PIXELS_HARD_FLOOR,
          );
          const hardFloorChanged = Number(
            process.env.MIN_CHANGED_PIXELS_HARD_FLOOR,
          );

          if (
            reviewBaseUrl !== 'https://aapopihkala.fi/private-model/' ||
            !reviewId ||
            !candidateId ||
            !clientId ||
            !clientSecret ||
            !expectedDatasetJson
          ) {
            throw new Error('Required production review inputs are missing');
          }

          const expectedDataset = JSON.parse(expectedDatasetJson);
          if (
            typeof expectedDataset !== 'object' ||
            expectedDataset === null ||
            Array.isArray(expectedDataset) ||
            Object.keys(expectedDataset).length === 0
          ) {
            throw new Error('Expected dataset contract must be a non-empty object');
          }

          if (
            minNonBackgroundPixels < hardFloorNonBackground ||
            minChangedPixels < hardFloorChanged
          ) {
            throw new Error('Pixel thresholds cannot weaken hard floors');
          }

          // Only exact scene67 runs start from the user's direct D1F TOP link.
          // All other reviews, including R1125 and X4, retain their routes.
          const exactD1fOneLink =
            reviewId === 'p137e-d1f-three-wall-mounted-themos-review' &&
            candidateId === 'p137e-d1f-three-wall-mounted-themos';
          const reviewUrl = reviewBaseUrl + '?review=' + encodeURIComponent(reviewId) +
            (exactD1fOneLink ? '&view=d1f-plan' : '');

          fs.mkdirSync('playwright-artifacts', { recursive: true });

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 1536, height: 900 },
          });

          await context.route('https://aapopihkala.fi/**', async (route) => {
            const headers = {
              ...route.request().headers(),
              'cf-access-client-id': clientId,
              'cf-access-client-secret': clientSecret,
            };
            await route.continue({ headers });
          });

          const page = await context.newPage();

          // Capture only requests made by the viewer's INITIAL review autoload.
          // The later independent no-cache asset probe must not satisfy this gate.
          const p137eViewerAutoloadResponses = [];
          // Only an actual viewer-initiated R1125 asset response can satisfy this
          // exact raw-byte gate; an independent probe must never substitute it.
          const r1125OriginalAutoloadUrl = new URL(
            '/private-model/work-test/m5a-r1125-pvk-diameter-source-split.glb',
            reviewBaseUrl,
          ).href;
          const r1125ViewerAutoloadResponses = [];
          page.on('response', (response) => {
            if (response.url() === P137E_SCENE67_PRODUCTION_GLB_URL) {
              p137eViewerAutoloadResponses.push(response);
            }
            if (response.url() === r1125OriginalAutoloadUrl) {
              r1125ViewerAutoloadResponses.push(response);
            }
          });

          try {
            const response = await page.goto(reviewUrl, {
              waitUntil: 'domcontentloaded',
              timeout: 45_000,
            });

            if (!response || response.status() !== 200) {
              throw new Error(
                'Production review navigation returned ' +
                  (response?.status() ?? 'no response'),
              );
            }

            const finalUrl = new URL(page.url());
            if (
              finalUrl.origin !== 'https://aapopihkala.fi' ||
              finalUrl.pathname !== '/private-model/' ||
              finalUrl.searchParams.get('review') !== reviewId ||
              (exactD1fOneLink
                ? finalUrl.searchParams.get('view') !== 'd1f-plan' ||
                  [...finalUrl.searchParams.keys()].length !== 2
                : [...finalUrl.searchParams.keys()].length !== 1)
            ) {
              throw new Error(
                'Production review left fixed viewer route or changed review identity: ' +
                  page.url(),
              );
            }

            await page.waitForSelector('#private-model-canvas', {
              timeout: 20_000,
            });

            await page.waitForFunction(
              ({ expectedReviewId, expectedCandidateId, expectedDataset }) => {
                const canvas = document.querySelector('#private-model-canvas');
                if (!(canvas instanceof HTMLCanvasElement)) return false;

                const baseReady =
                  canvas.dataset.workTestReviewAutoload === 'true' &&
                  canvas.dataset.modelSource === 'work-test' &&
                  canvas.dataset.workTestReviewMode === expectedReviewId &&
                  canvas.dataset.workTestReviewCandidate === expectedCandidateId;

                if (!baseReady) return false;

                return Object.entries(expectedDataset).every(
                  ([key, expectedValue]) =>
                    canvas.dataset[key] === String(expectedValue),
                );
              },
              {
                expectedReviewId: reviewId,
                expectedCandidateId: candidateId,
                expectedDataset,
              },
              { timeout: 35_000 },
            );

            const canvas = page.locator('#private-model-canvas');
            await page.waitForTimeout(1000);

            // Exact source metadata guard is mandatory, not optional caller
            // expected_dataset_json. Source digest and 3/3 pixels remain separate.
            const p137eScene67SourceEvidence = inspectP137EScene67ProductionSmoke(
              reviewId,
              candidateId,
              await canvas.evaluate((element) => ({ ...element.dataset })),
            );
            if (p137eScene67SourceEvidence) {
              fs.writeFileSync(
                'playwright-artifacts/p137e-scene67-source-metadata.json',
                JSON.stringify(p137eScene67SourceEvidence, null, 2),
              );
            }

