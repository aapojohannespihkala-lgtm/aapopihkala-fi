name: NPM audit maintenance

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        shell: bash
        run: |
          set +e
          npm audit --json > audit.json
          audit_exit=$?
          set -e
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          console.log('AUDIT_METADATA=' + JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, vuln] of Object.entries(report.vulnerabilities ?? {})) {
            console.log('AUDIT_VULNERABILITY=' + JSON.stringify({
              name,
              severity: vuln.severity,
              isDirect: vuln.isDirect,
              range: vuln.range,
              fixAvailable: vuln.fixAvailable,
              via: (vuln.via ?? []).map((item) => typeof item === 'string' ? item : {
                source: item.source,
                name: item.name,
                severity: item.severity,
                title: item.title,
                range: item.range,
                url: item.url,
              }),
            }));
          }
          NODE
          echo "npm audit exit code: $audit_exit"
