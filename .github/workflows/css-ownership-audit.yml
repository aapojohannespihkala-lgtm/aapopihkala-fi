name: CSS ownership audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  audit:
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply ownership cleanup
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceOnce(text, from, to, label) {
            const first = text.indexOf(from);
            if (first === -1) throw new Error(`Missing expected block: ${label}`);
            if (text.indexOf(from, first + from.length) !== -1) throw new Error(`Expected one block only: ${label}`);
            return text.slice(0, first) + to + text.slice(first + from.length);
          }

          const globalPath = 'src/styles/global.css';
          let globalCss = fs.readFileSync(globalPath, 'utf8');

          const globalReplacements = [
            [
              `.feed-post {\n  position: relative;\n\n  padding:\n    68px\n    0\n    16px;\n\n  border-top: none;\n}`,
              `.feed-post {\n  position: relative;\n\n  border-top: none;\n}`,
              'feed-post base padding',
            ],
            [
              `\n\n.feed-post + .feed-post {\n  padding-top: 32px;\n}`,
              ``,
              'feed-post sibling padding',
            ],
            [
              `.post-meta {\n  margin:\n    0\n    0\n    20px;\n\n  display: flex;`,
              `.post-meta {\n  display: flex;`,
              'post-meta base margin',
            ],
            [
              `.post-title {\n  margin:\n    0\n    0\n    38px;\n\n  max-width: 700px;`,
              `.post-title {\n  max-width: 700px;`,
              'post-title base margin',
            ],
            [
              `.post-perspective-label {\n  margin:\n    48px\n    0\n    20px;\n\n  color: #8d938b;`,
              `.post-perspective-label {\n  color: #8d938b;`,
              'perspective base margin',
            ],
            [
              `.source {\n  max-width: 640px;\n\n  margin-top: 52px;\n  padding-top: 16px;\n\n  display: flex;`,
              `.source {\n  max-width: 640px;\n\n  display: flex;`,
              'source base spacing',
            ],
            [
              `\n\n  border-top:\n    1px solid\n    var(--line-soft);\n\n  color: var(--stone);`,
              `\n\n  color: var(--stone);`,
              'source base border',
            ],
            [
              `\n\n  .feed-post {\n    padding:\n      56px\n      0\n      12px;\n  }\n\n\n  .feed-post + .feed-post {\n    padding-top: 26px;\n  }`,
              ``,
              'mobile feed-post padding',
            ],
            [
              `  .post-meta {\n    margin-bottom: 18px;\n    font-size: 0.625rem;\n  }`,
              `  .post-meta {\n    font-size: 0.625rem;\n  }`,
              'mobile post-meta margin',
            ],
            [
              `  .post-title {\n    margin-bottom: 30px;\n\n    font-size:`,
              `  .post-title {\n    font-size:`,
              'mobile post-title margin',
            ],
            [
              `  .post-perspective-label {\n    margin:\n      42px\n      0\n      18px;\n\n    font-size: 0.96rem;\n  }`,
              `  .post-perspective-label {\n    font-size: 0.96rem;\n  }`,
              'mobile perspective margin',
            ],
            [
              `\n\n\n  .source {\n    margin-top: 44px;\n  }`,
              ``,
              'mobile source margin',
            ],
          ];

          for (const [from, to, label] of globalReplacements) {
            globalCss = replaceOnce(globalCss, from, to, label);
          }
          fs.writeFileSync(globalPath, globalCss);

          const feedPath = 'src/components/FeedPost.astro';
          let feed = fs.readFileSync(feedPath, 'utf8');
          const feedReplacements = [
            [
              `  .feed-post {\n    padding-top: 52px;\n    padding-bottom: 0;\n  }`,
              `  .feed-post {\n    padding: 52px 0 0;\n  }`,
              'FeedPost desktop padding',
            ],
            [
              `  .post-meta {\n    margin-bottom: 15px;\n  }`,
              `  .post-meta {\n    margin: 0 0 15px;\n  }`,
              'FeedPost meta margin',
            ],
            [
              `  .post-title {\n    margin-bottom: 31px;\n  }`,
              `  .post-title {\n    margin: 0 0 31px;\n  }`,
              'FeedPost title margin',
            ],
            [
              `  .post-perspective-label {\n    margin-top: 40px;\n  }`,
              `  .post-perspective-label {\n    margin: 40px 0 20px;\n  }`,
              'FeedPost perspective margin',
            ],
            [
              `    .feed-post {\n      padding-top: 46px;\n      padding-bottom: 0;\n    }`,
              `    .feed-post {\n      padding: 46px 0 0;\n    }`,
              'FeedPost mobile padding',
            ],
            [
              `\n\n    .post-meta {\n      margin-bottom: 15px;\n    }`,
              ``,
              'FeedPost redundant mobile meta margin',
            ],
            [
              `    .post-perspective-label {\n      margin-top: 36px;\n    }`,
              `    .post-perspective-label {\n      margin: 36px 0 18px;\n    }`,
              'FeedPost mobile perspective margin',
            ],
          ];
          for (const [from, to, label] of feedReplacements) {
            feed = replaceOnce(feed, from, to, label);
          }
          fs.writeFileSync(feedPath, feed);
          NODE

      - name: Validate cleanup
        run: |
          npm run check
          npm run build

      - name: Commit validated cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/styles/global.css src/components/FeedPost.astro; then
            echo "Cleanup already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/global.css src/components/FeedPost.astro
          git commit -m "Clarify FeedPost CSS ownership"
          git push origin "HEAD:${{ github.head_ref }}"
