name: CSS ownership audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Inspect global CSS ownership
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const root = process.cwd();
          const src = path.join(root, 'src');
          const globalPath = path.join(src, 'styles/global.css');
          const globalCss = fs.readFileSync(globalPath, 'utf8');
          const relative = (file) => path.relative(root, file).replaceAll(path.sep, '/');

          const astroFiles = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.name.endsWith('.astro')) astroFiles.push(full);
            }
          }
          walk(src);

          const classNames = [...new Set([...globalCss.matchAll(/\.([A-Za-z_][A-Za-z0-9_-]*)/g)].map((m) => m[1]))].sort();
          const variableNames = [...new Set([...globalCss.matchAll(/(--[A-Za-z0-9_-]+)\s*:/g)].map((m) => m[1]))].sort();

          console.log(`GLOBAL_CLASS_COUNT=${classNames.length}`);
          for (const className of classNames) {
            const markupOwners = [];
            const styleOwners = [];
            for (const file of astroFiles) {
              const text = fs.readFileSync(file, 'utf8');
              const styleBlocks = [...text.matchAll(/<style(?:\s[^>]*)?>([\s\S]*?)<\/style>/g)].map((m) => m[1]);
              const markup = text.replace(/<style(?:\s[^>]*)?>[\s\S]*?<\/style>/g, '');
              const classAttrs = [...markup.matchAll(/class\s*=\s*["']([^"']+)["']/g)].flatMap((m) => m[1].split(/\s+/));
              if (classAttrs.includes(className)) markupOwners.push(relative(file));
              if (styleBlocks.some((css) => new RegExp(`\\.${className}(?![A-Za-z0-9_-])`).test(css))) styleOwners.push(relative(file));
            }
            console.log(`CLASS_OWNERS=${className}::markup=${markupOwners.join(',') || '-'}::styles=${styleOwners.join(',') || '-'}`);
          }

          console.log(`GLOBAL_VARIABLE_COUNT=${variableNames.length}`);
          for (const variable of variableNames) {
            const useCount = (globalCss.match(new RegExp(`var\\(${variable.replace(/[.*+?^${}()|[\\]\\]/g, '\\$&')}[),]`, 'g')) || []).length;
            const externalOwners = [];
            for (const file of astroFiles) {
              const text = fs.readFileSync(file, 'utf8');
              if (text.includes(`var(${variable}`)) externalOwners.push(relative(file));
            }
            console.log(`VARIABLE_USE=${variable}::global=${useCount}::external=${externalOwners.join(',') || '-'}`);
          }
          NODE
