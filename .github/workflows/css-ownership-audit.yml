name: CSS ownership audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Inspect global CSS ownership
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const root = process.cwd();
          const globalPath = path.join(root, 'src/styles/global.css');
          const globalCss = fs.readFileSync(globalPath, 'utf8');

          const files = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (/\.(astro|css|ts|js|mjs|md|mdx)$/.test(entry.name)) files.push(full);
            }
          }
          walk(path.join(root, 'src'));

          const relative = (file) => path.relative(root, file).replaceAll(path.sep, '/');
          const otherFiles = files.filter((file) => file !== globalPath);
          const contents = new Map(otherFiles.map((file) => [file, fs.readFileSync(file, 'utf8')]));

          const classNames = [...new Set([...globalCss.matchAll(/\.([A-Za-z_][A-Za-z0-9_-]*)/g)].map((m) => m[1]))].sort();
          const variableNames = [...new Set([...globalCss.matchAll(/(--[A-Za-z0-9_-]+)\s*:/g)].map((m) => m[1]))].sort();

          console.log(`GLOBAL_CLASS_COUNT=${classNames.length}`);
          for (const className of classNames) {
            const owners = [];
            const needle = className;
            for (const [file, text] of contents) {
              if (text.includes(needle)) owners.push(relative(file));
            }
            if (owners.length === 0) {
              console.log(`UNUSED_GLOBAL_CLASS=${className}`);
            } else {
              console.log(`GLOBAL_CLASS_OWNERS=${className}::${owners.join(',')}`);
            }
          }

          console.log(`GLOBAL_VARIABLE_COUNT=${variableNames.length}`);
          for (const variable of variableNames) {
            const owners = [];
            for (const [file, text] of contents) {
              if (text.includes(variable)) owners.push(relative(file));
            }
            if (owners.length === 0) {
              console.log(`UNUSED_GLOBAL_VARIABLE=${variable}`);
            } else {
              console.log(`GLOBAL_VARIABLE_OWNERS=${variable}::${owners.join(',')}`);
            }
          }
          NODE
