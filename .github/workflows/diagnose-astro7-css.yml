name: Apply Astro 7 migration fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migration compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          hover_path = Path('src/components/HomepageHoverMeta.astro')
          hover = hover_path.read_text()
          old_transition = """    transition:
                max-width 310ms cubic-bezier(0.22, 1, 0.36, 1) !important,
                opacity 70ms linear !important,
                transform 310ms cubic-bezier(0.22, 1, 0.36, 1) !important;
          """
          new_transition = """    transition:
                max-width 310ms cubic-bezier(0.22, 1, 0.36, 1),
                opacity 70ms linear,
                transform 310ms cubic-bezier(0.22, 1, 0.36, 1) !important;
          """
          if old_transition in hover:
              hover = hover.replace(old_transition, new_transition, 1)
              hover_path.write_text(hover)
          elif new_transition not in hover:
              raise SystemExit('Expected LinkedIn terminal transition declaration not found')

          content_path = Path('src/content.config.ts')
          content = content_path.read_text()
          old_datetime = """      publishedAt:
                  z.string()
                    .datetime({
                      offset: true,
                    }),
          """
          new_datetime = """      publishedAt:
                  z.iso.datetime({
                    offset: true,
                  }),
          """
          if old_datetime in content:
              content = content.replace(old_datetime, new_datetime, 1)
          elif new_datetime not in content:
              raise SystemExit('Expected publishedAt datetime schema not found')

          old_issue = """            code:
                        z.ZodIssueCode
                          .custom,
          """
          new_issue = """            code: 'custom',
          """
          issue_count = content.count(old_issue)
          if issue_count:
              if issue_count != 2:
                  raise SystemExit(f'Expected 2 deprecated Zod issue-code uses, found {issue_count}')
              content = content.replace(old_issue, new_issue)
          elif content.count(new_issue) != 2:
              raise SystemExit('Expected migrated Zod custom issue codes not found')

          content_path.write_text(content)
          PY

      - name: Validate Astro 7 migration
        run: |
          npm run check
          npm run build

      - name: Commit validated migration fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/components/HomepageHoverMeta.astro src/content.config.ts; then
            echo "Migration fixes already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/HomepageHoverMeta.astro src/content.config.ts
          git commit -m "Fix Astro 7 migration compatibility"
          git push origin "HEAD:${{ github.head_ref }}"
