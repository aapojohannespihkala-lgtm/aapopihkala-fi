name: Private model bathroom service review

on:
  workflow_dispatch:
    inputs:
      review_mode:
        description: 'Which D1F bathroom service review to run'
        required: true
        type: choice
        default: service
        options:
          - service
          - shower-autoload
          - odensvik-autoload
          - odensvik-winding-pixels
          - source156-autoload
          - source156-pixels

permissions:
  contents: read

concurrency:
  group: private-model-d1f-service-review
  cancel-in-progress: false

jobs:
  render:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant:
          - WEST_ANCHOR_725_895_740
          - WEST_ANCHOR_740_895_725
          - EAST_ANCHOR_725_895_740
          - EAST_ANCHOR_740_895_725
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify exact source, device interaction and each rendered target
        if: inputs.review_mode == 'service'
        env:
          D1F_SERVICE_VARIANT: ${{ matrix.variant }}
          CF_ACCESS_VIEWER_PROBE_CLIENT_ID: ${{ secrets.CF_ACCESS_VIEWER_PROBE_CLIENT_ID }}
          CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET: ${{ secrets.CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET }}
        run: node .github/scripts/private-model-d1f-service-probe.mjs
      - name: Verify shower exact original GLB, one-link autoload and general WebGL
        if: inputs.review_mode == 'shower-autoload'
        env:
          PROBE_MODE: d1f-shower-autoload
          D1F_SHOWER_VARIANT: ${{ matrix.variant }}
          CF_ACCESS_VIEWER_PROBE_CLIENT_ID: ${{ secrets.CF_ACCESS_VIEWER_PROBE_CLIENT_ID }}
          CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET: ${{ secrets.CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET }}
        run: node .github/scripts/private-model-d1f-shower-autoload-probe.mjs
      - name: Verify ODENSVIK exact original GLB, one-link autoload and general WebGL only
        if: inputs.review_mode == 'odensvik-autoload'
        env:
          PROBE_MODE: d1f-odensvik-autoload
          D1F_ODENSVIK_VARIANT: ${{ matrix.variant }}
          CF_ACCESS_VIEWER_PROBE_CLIENT_ID: ${{ secrets.CF_ACCESS_VIEWER_PROBE_CLIENT_ID }}
          CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET: ${{ secrets.CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET }}
        run: node .github/scripts/private-model-d1f-odensvik-autoload-probe.mjs
      - name: Verify corrected ODENSVIK 116-scene three original object WebGL RGB pixels
        if: inputs.review_mode == 'odensvik-winding-pixels'
        env:
          PROBE_MODE: d1f-odensvik-winding-pixels
          D1F_ODENSVIK_VARIANT: ${{ matrix.variant }}
          CF_ACCESS_VIEWER_PROBE_CLIENT_ID: ${{ secrets.CF_ACCESS_VIEWER_PROBE_CLIENT_ID }}
          CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET: ${{ secrets.CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET }}
        run: node .github/scripts/private-model-d1f-odensvik-winding-object-pixel-probe.mjs
      - name: Verify SOURCE156 original exact autoload and general WebGL (not seven object proof)
        if: inputs.review_mode == 'source156-autoload' && matrix.variant == 'WEST_ANCHOR_725_895_740'
        env:
          D1F_SERVICE_SOURCE156_AUTOLOAD: '1'
          CF_ACCESS_VIEWER_PROBE_CLIENT_ID: ${{ secrets.CF_ACCESS_VIEWER_PROBE_CLIENT_ID }}
          CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET: ${{ secrets.CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET }}
        run: node .github/scripts/private-model-d1f-service-probe.mjs
      - name: Verify SOURCE156 seven original object WebGL RGB pixels in distinct cameras
        if: inputs.review_mode == 'source156-pixels' && matrix.variant == 'WEST_ANCHOR_725_895_740'
        env:
          PROBE_MODE: d1f-source156-original7-pixels
          CF_ACCESS_VIEWER_PROBE_CLIENT_ID: ${{ secrets.CF_ACCESS_VIEWER_PROBE_CLIENT_ID }}
          CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET: ${{ secrets.CF_ACCESS_VIEWER_PROBE_CLIENT_SECRET }}
        run: node .github/scripts/private-model-d1f-source156-seven-production-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always() && inputs.review_mode == 'source156-pixels' && matrix.variant == 'WEST_ANCHOR_725_895_740'
        with:
          name: d1f-source156-seven-original-webgl-pixels
          path: test-results/d1f-source156-seven-original-production/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && inputs.review_mode == 'source156-autoload' && matrix.variant == 'WEST_ANCHOR_725_895_740'
        with:
          name: d1f-source156-original-autoload-general-webgl
          path: test-results/d1f-source156-original-autoload/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && inputs.review_mode == 'service'
        with:
          name: d1f-service-${{ matrix.variant }}
          path: test-results/d1f-service/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && inputs.review_mode == 'shower-autoload'
        with:
          name: d1f-shower-autoload-${{ matrix.variant }}
          path: test-results/d1f-shower-autoload-production/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && inputs.review_mode == 'odensvik-winding-pixels'
        with:
          name: d1f-odensvik-116-corrected-original-pixels-${{ matrix.variant }}
          path: test-results/d1f-odensvik-winding-original-object-pixels/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && inputs.review_mode == 'odensvik-autoload'
        with:
          name: d1f-odensvik-autoload-${{ matrix.variant }}
          path: test-results/d1f-odensvik-autoload-production/
          if-no-files-found: error
