name: Android Snapshot Widget APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-snapshot-widget/**'
      - '.github/workflows/android-snapshot-widget.yml'
  push:
    branches: [main]
    paths:
      - 'android-snapshot-widget/**'
      - '.github/workflows/android-snapshot-widget.yml'

permissions:
  contents: read

# Main builds use the persistent Snapshot Widget signing key.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default includes the retired SDK package `tools`.
          # Command-line tools are installed by the action itself, and the
          # exact platform/build-tools packages are installed below.
          packages: ''

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Test and compile PR debug APK
        if: github.event_name == 'pull_request'
        working-directory: android-snapshot-widget
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Require persistent signing key
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
        run: |
          if [ -z "$SIGNING_KEY_B64" ]; then
            echo 'ANDROID_SIGNING_KEY_B64 repository secret is required for stable APK builds.' >&2
            exit 1
          fi

      - name: Restore persistent signing key
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
        run: |
          echo "$SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/snapshot-widget-release.p12"
          chmod 600 "$RUNNER_TEMP/snapshot-widget-release.p12"

      - name: Test and build signed release APK
        if: github.event_name != 'pull_request'
        working-directory: android-snapshot-widget
        env:
          SNAPSHOT_SIGNING_STORE_PATH: ${{ runner.temp }}/snapshot-widget-release.p12
          SNAPSHOT_SIGNING_STORE_PASSWORD: snapshot-widget-2026
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Verify release signature
        if: github.event_name != 'pull_request'
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android-snapshot-widget/app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK
        if: github.event_name != 'pull_request'
        run: cp android-snapshot-widget/app/build/outputs/apk/release/app-release.apk SnapshotWidget.apk

      - name: Upload APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SnapshotWidget-APK
          path: SnapshotWidget.apk
          if-no-files-found: error
          retention-days: 30
