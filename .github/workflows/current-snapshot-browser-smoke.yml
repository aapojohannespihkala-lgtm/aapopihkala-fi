name: Current Snapshot browser smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-snapshot-browser-smoke
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production Widget v2 endpoint
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import { widgetV2ProductionPayloadError } from './.github/scripts/snapshot-http-diagnostics.mjs';
          const url = `https://aapopihkala.fi/api/current/widget-v2?channel=prod&live_smoke=${process.env.GITHUB_RUN_ID}`;
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 20_000);
          const started = Date.now();

          try {
            const response = await fetch(url, {
              headers: {
                Accept: 'application/json',
                'Cache-Control': 'no-cache',
                'User-Agent': 'SnapshotWidgetSmoke/1.0',
              },
              signal: controller.signal,
            });
            const body = await response.text();
            const diagnostics = {
              status: response.status,
              elapsedMs: Date.now() - started,
              contentType: response.headers.get('content-type'),
              widgetSchema: response.headers.get('x-widget-schema'),
              body: body.slice(0, 2000),
            };
            console.log(JSON.stringify(diagnostics, null, 2));

            if (!response.ok) {
              console.error(`Widget v2 returned HTTP ${response.status}`);
              process.exitCode = 1;
            } else {
              let payload;
              try {
                payload = JSON.parse(body);
              } catch {
                console.error('Widget v2 did not return valid JSON.');
                process.exitCode = 1;
              }

              if (payload) {
                const sections = Array.isArray(payload.sections) ? payload.sections : [];
                console.log(`Widget v2 sections: ${sections.map((section) => section?.id).filter(Boolean).join(', ')}`);
                const validationError = widgetV2ProductionPayloadError(payload);
                if (validationError) {
                  console.error(`Widget v2 production payload invalid: ${validationError}`);
                  process.exitCode = 1;
                }
              }
            }
          } catch (error) {
            console.error(`Widget v2 request failed after ${Date.now() - started} ms`);
            console.error(error);
            process.exitCode = 1;
          } finally {
            clearTimeout(timeout);
          }
          NODE

      - name: Verify Snapshot HTTP diagnostics
        if: ${{ !cancelled() }}
        run: node --test .github/scripts/test-snapshot-http-diagnostics.mjs

      - name: Install Chromium
        id: chromium
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium

      - name: Verify production standalone Widget in browser
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import { widgetBrowserResponseFailure, widgetBrowserRequestFailure, widgetBrowserReady, widgetBrowserRenderableSections } from './.github/scripts/snapshot-http-diagnostics.mjs';

          const url = `https://aapopihkala.fi/current/widget/?live_smoke=${process.env.GITHUB_RUN_ID}`;
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1024, height: 768 } });
          const failures = [];
          page.on('pageerror', (error) => failures.push(`pageerror: ${error.name || 'Error'}`));
          page.on('response', (response) => {
            const diagnostic = widgetBrowserResponseFailure(
              response.url(), response.status(), response.request().method(),
            );
            if (diagnostic) failures.push(`http: ${JSON.stringify(diagnostic)}`);
          });
          page.on('requestfailed', (request) => {
            const diagnostic = widgetBrowserRequestFailure(
              request.url(), request.failure()?.errorText, request.method(),
            );
            if (diagnostic) failures.push(`requestfailed: ${JSON.stringify(diagnostic)}`);
          });

          try {
            let verified = false;
            let diagnostics = null;

            for (let attempt = 1; attempt <= 6; attempt += 1) {
              failures.length = 0;
              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30_000 });
              try {
                await page.waitForFunction(
                  () => ['ready', 'stale', 'error'].includes(
                    document.querySelector('[data-widget-root]')?.getAttribute('data-load-state'),
                  ),
                  null,
                  { timeout: 20_000 },
                );
              } catch {
                // Capture diagnostics for stalled loads and retry below.
              }

              diagnostics = await page.evaluate(() => {
                const root = document.querySelector('[data-widget-root]');
                const status = document.querySelector('[data-status]');
                const sections = [...document.querySelectorAll('[data-section]')]
                  .map((section) => {
                    const bounds = section.getBoundingClientRect();
                    const style = window.getComputedStyle(section);
                    return {
                      id: section.getAttribute('data-section'),
                      visible: bounds.width > 0 && bounds.height > 0 &&
                        style.display !== 'none' && style.visibility === 'visible',
                      primary: section.querySelector('.android-primary, .metric-primary')?.textContent?.trim() ?? '',
                    };
                  });
                return {
                  loadState: root?.getAttribute('data-load-state') ?? null,
                  status: status?.textContent?.trim() ?? '',
                  sections,
                  unavailable: document.querySelector('[data-widget]')?.textContent?.includes('UNAVAILABLE') ?? false,
                };
              });
              const renderedSections = widgetBrowserRenderableSections(diagnostics.sections);
              console.log(JSON.stringify({ attempt, ...diagnostics, sections: renderedSections, failures: failures.slice(0, 10) }, null, 2));

              if (widgetBrowserReady({ ...diagnostics, sections: renderedSections, failures })) {
                verified = true;
                break;
              }

              if (attempt < 6) await page.waitForTimeout(10_000);
            }

            if (!verified) {
              console.error('Production standalone Widget did not pass browser verification.');
              console.error(JSON.stringify({ ...diagnostics, sections: widgetBrowserRenderableSections(diagnostics?.sections), failures: failures.slice(0, 10) }, null, 2));
              process.exitCode = 1;
            }
          } finally {
            await browser.close();
          }
          NODE

      - name: Verify production Snapshot sources in browser
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import { snapshotResponseDiagnostic, snapshotRequestFailureDiagnostic, snapshotBrowserReady } from './.github/scripts/snapshot-http-diagnostics.mjs';

          const url = `https://aapopihkala.fi/current/snapshot/?live_smoke=${process.env.GITHUB_RUN_ID}`;
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
          const failures = [];
          const httpResponses = [];

          page.on('pageerror', (error) => failures.push(`pageerror: ${error.message}`));
          page.on('response', (response) => {
            const diagnostic = snapshotResponseDiagnostic(
              response.url(),
              response.status(),
              response.request().method(),
            );
            if (diagnostic && httpResponses.length < 50) httpResponses.push(diagnostic);
          });
          page.on('requestfailed', (request) => {
            const diagnostic = snapshotRequestFailureDiagnostic(
              request.url(),
              request.failure()?.errorText,
              request.method(),
            );
            if (diagnostic) failures.push(`requestfailed: ${JSON.stringify(diagnostic)}`);
          });

          const text = async (selector) =>
            ((await page.locator(selector).first().textContent().catch(() => null)) ?? '').trim();

          const snapshotDiagnostics = async () => ({
            status: await text('[data-snapshot-status]'),
            weatherTemperature: await text('[data-snapshot-weather-temperature]'),
            weatherCondition: await text('[data-snapshot-weather-condition]'),
            electricityAverage: await text('[data-snapshot-electricity-now]'),
            electricityCurrent: await text('[data-snapshot-electricity-average]'),
            euribor: await text('[data-snapshot-euribor]'),
            marketWorld: await text('[data-snapshot-market="ishares-world"]'),
            marketUsa: await text('[data-snapshot-market="handelsbanken-usa"]'),
            liigaSchedule: await text('[data-snapshot-liiga-schedule]'),
            liigaHomeTeam: await text('[data-snapshot-liiga-home-team]'),
          });

          let lastDiagnostics = null;
          let verified = false;

          try {
            for (let attempt = 1; attempt <= 6; attempt += 1) {
              console.log(`Snapshot browser attempt ${attempt}/6`);
              failures.length = 0;
              httpResponses.length = 0;

              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30_000 });

              try {
                await page
                  .locator('[data-snapshot-status]')
                  .filter({ hasText: /^LIVE DATA \/ OK$/ })
                  .waitFor({ state: 'visible', timeout: 20_000 });
              } catch {
                // Capture diagnostics below and retry through ordinary deployment/upstream lag.
              }

              lastDiagnostics = await snapshotDiagnostics();
              console.log(JSON.stringify(lastDiagnostics, null, 2));
              console.log(`Snapshot source HTTP statuses: ${JSON.stringify(httpResponses)}`);

              if (snapshotBrowserReady({ ...lastDiagnostics, failures, httpResponses })) {
                console.log('Production Snapshot verified: all 5 sources reached fulfilled state.');
                verified = true;
                break;
              }

              if (failures.length > 0) {
                console.error(failures.join('\n'));
              }

              if (attempt < 6) await page.waitForTimeout(10_000);
            }

            if (!verified) {
              console.error('Production Snapshot did not reach LIVE DATA / OK.');
              console.error(JSON.stringify(lastDiagnostics, null, 2));
              if (failures.length > 0) console.error(failures.join('\n'));
              process.exitCode = 1;
            }
          } finally {
            await browser.close();
          }
          NODE
