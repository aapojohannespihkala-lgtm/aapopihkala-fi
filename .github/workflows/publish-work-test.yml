name: Publish WORK_TEST
run-name: "Publish WORK_TEST - ${{ inputs.candidate }}"

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Allowlisted WORK_TEST candidate id
        required: true
        default: p150g-whole-building-end-plinth
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-work-test
  cancel-in-progress: false

env:
  CATALOG_URL: https://aapopihkala.fi/private-model/work-test/verify/catalog.json

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require trusted main dispatch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_REPOSITORY" == "aapojohannespihkala-lgtm/aapopihkala-fi" ]]

      - name: Checkout exact main release registry
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Resolve allowlisted candidate
        shell: bash
        env:
          REQUESTED_CANDIDATE: ${{ inputs.candidate }}
        run: |
          set -euo pipefail

          python3 - ".github/work-test-candidates.json" "$REQUESTED_CANDIDATE" "$GITHUB_ENV" <<'PY'
          import json
          import re
          import sys

          registry_path, candidate_id, env_path = sys.argv[1:]
          with open(registry_path, "r", encoding="utf-8") as handle:
              payload = json.load(handle)

          if set(payload) != {"version", "candidates"} or payload.get("version") != 1:
              raise SystemExit("invalid WORK_TEST candidate registry envelope")

          candidates = payload.get("candidates")
          if not isinstance(candidates, dict):
              raise SystemExit("invalid WORK_TEST candidate registry")

          if not re.fullmatch(r"[a-z0-9][a-z0-9-]{0,127}", candidate_id):
              raise SystemExit("invalid WORK_TEST candidate id")

          entry = candidates.get(candidate_id)
          if not isinstance(entry, dict) or set(entry) != {"driveFileId"}:
              raise SystemExit("Unsupported WORK_TEST candidate")

          drive_file_id = entry.get("driveFileId")
          if not isinstance(drive_file_id, str) or not re.fullmatch(r"[A-Za-z0-9_-]{10,128}", drive_file_id):
              raise SystemExit("invalid WORK_TEST Drive file id")

          values = {
              "DRIVE_FILE_ID": drive_file_id,
              "CANDIDATE_ID": candidate_id,
              "EXPECTED_PATH": f"/private-model/work-test/{candidate_id}.glb",
              "PUBLISH_URL": f"https://aapopihkala.fi/private-model/work-test/publish/{candidate_id}.glb",
              "GLB_URL": f"https://aapopihkala.fi/private-model/work-test/verify/{candidate_id}.glb",
          }
          with open(env_path, "a", encoding="utf-8") as handle:
              for key, value in values.items():
                  handle.write(f"{key}={value}\n")
          PY

      - name: Require machine-auth configuration
        shell: bash
        env:
          GDRIVE_WIF_PROVIDER: ${{ vars.GDRIVE_WIF_PROVIDER }}
          GDRIVE_PUBLISHER_SERVICE_ACCOUNT: ${{ vars.GDRIVE_PUBLISHER_SERVICE_ACCOUNT }}
          CF_ACCESS_PUBLISHER_CLIENT_ID: ${{ secrets.CF_ACCESS_PUBLISHER_CLIENT_ID }}
          CF_ACCESS_PUBLISHER_CLIENT_SECRET: ${{ secrets.CF_ACCESS_PUBLISHER_CLIENT_SECRET }}
          CF_ACCESS_READBACK_CLIENT_ID: ${{ secrets.CF_ACCESS_READBACK_CLIENT_ID }}
          CF_ACCESS_READBACK_CLIENT_SECRET: ${{ secrets.CF_ACCESS_READBACK_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          [[ -n "$GDRIVE_WIF_PROVIDER" ]] || { echo "Missing GDRIVE_WIF_PROVIDER repository variable" >&2; exit 1; }
          [[ -n "$GDRIVE_PUBLISHER_SERVICE_ACCOUNT" ]] || { echo "Missing GDRIVE_PUBLISHER_SERVICE_ACCOUNT repository variable" >&2; exit 1; }
          [[ -n "$CF_ACCESS_PUBLISHER_CLIENT_ID" ]] || { echo "Missing CF_ACCESS_PUBLISHER_CLIENT_ID secret" >&2; exit 1; }
          [[ -n "$CF_ACCESS_PUBLISHER_CLIENT_SECRET" ]] || { echo "Missing CF_ACCESS_PUBLISHER_CLIENT_SECRET secret" >&2; exit 1; }
          [[ -n "$CF_ACCESS_READBACK_CLIENT_ID" ]] || { echo "Missing CF_ACCESS_READBACK_CLIENT_ID secret" >&2; exit 1; }
          [[ -n "$CF_ACCESS_READBACK_CLIENT_SECRET" ]] || { echo "Missing CF_ACCESS_READBACK_CLIENT_SECRET secret" >&2; exit 1; }

      - name: Authenticate to Google Drive
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GDRIVE_WIF_PROVIDER }}
          service_account: ${{ vars.GDRIVE_PUBLISHER_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          create_credentials_file: false
          export_environment_variables: false

      - name: Download and derive exact private Drive GLB identity
        shell: bash
        env:
          GDRIVE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          model="$RUNNER_TEMP/work-test-source.glb"
          curl --silent --show-error --fail --location \
            --header "Authorization: Bearer $GDRIVE_ACCESS_TOKEN" \
            --output "$model" \
            "https://www.googleapis.com/drive/v3/files/$DRIVE_FILE_ID?alt=media&supportsAllDrives=true"

          actual_size="$(stat -c '%s' "$model")"
          actual_sha="$(sha256sum "$model" | awk '{print $1}')"
          [[ "$(head -c 4 "$model")" == "glTF" ]] || { echo "Drive source is not a GLB" >&2; exit 1; }

          {
            echo "EXPECTED_SIZE=$actual_size"
            echo "EXPECTED_SHA256=$actual_sha"
          } >> "$GITHUB_ENV"

          echo "Exact Drive source identity derived from raw bytes."

      - name: Publish exact bytes through machine-only endpoint
        shell: bash
        env:
          CF_ACCESS_PUBLISHER_CLIENT_ID: ${{ secrets.CF_ACCESS_PUBLISHER_CLIENT_ID }}
          CF_ACCESS_PUBLISHER_CLIENT_SECRET: ${{ secrets.CF_ACCESS_PUBLISHER_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          model="$RUNNER_TEMP/work-test-source.glb"
          response="$RUNNER_TEMP/publish-response.json"

          curl --silent --show-error --fail \
            --request PUT \
            --header "CF-Access-Client-Id: $CF_ACCESS_PUBLISHER_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $CF_ACCESS_PUBLISHER_CLIENT_SECRET" \
            --header "Content-Type: model/gltf-binary" \
            --header "Content-Length: $EXPECTED_SIZE" \
            --data-binary "@$model" \
            --output "$response" \
            "$PUBLISH_URL"

          python3 - "$response" "$CANDIDATE_ID" "$EXPECTED_PATH" <<'PY'
          import json
          import sys

          path, candidate_id, expected_path = sys.argv[1:]
          with open(path, "r", encoding="utf-8") as handle:
              payload = json.load(handle)

          candidate = payload.get("candidate") or {}
          if payload.get("ready") is not True:
              raise SystemExit("machine publish response is not ready")
          if candidate.get("id") != candidate_id:
              raise SystemExit("machine publish candidate mismatch")
          if candidate.get("path") != expected_path:
              raise SystemExit("machine publish path mismatch")
          PY
          echo "Machine publish response verified."

      - name: Read production catalog back
        shell: bash
        env:
          CF_ACCESS_READBACK_CLIENT_ID: ${{ secrets.CF_ACCESS_READBACK_CLIENT_ID }}
          CF_ACCESS_READBACK_CLIENT_SECRET: ${{ secrets.CF_ACCESS_READBACK_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          catalog="$RUNNER_TEMP/catalog.json"

          curl --silent --show-error --fail \
            --connect-timeout 10 \
            --max-time 30 \
            --header "CF-Access-Client-Id: $CF_ACCESS_READBACK_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $CF_ACCESS_READBACK_CLIENT_SECRET" \
            --output "$catalog" \
            "$CATALOG_URL"

          python3 - "$catalog" "$CANDIDATE_ID" "$EXPECTED_PATH" <<'PY'
          import json
          import sys

          path, candidate_id, expected_path = sys.argv[1:]
          with open(path, "r", encoding="utf-8") as handle:
              payload = json.load(handle)

          matches = [
              candidate
              for candidate in payload.get("candidates", [])
              if candidate.get("id") == candidate_id
          ]
          if len(matches) != 1:
              raise SystemExit("production catalog candidate missing or duplicated")
          if matches[0].get("path") != expected_path:
              raise SystemExit("production catalog path mismatch")
          PY
          echo "Production catalog readback verified."

      - name: Read full production GLB back and verify bytes
        shell: bash
        env:
          CF_ACCESS_READBACK_CLIENT_ID: ${{ secrets.CF_ACCESS_READBACK_CLIENT_ID }}
          CF_ACCESS_READBACK_CLIENT_SECRET: ${{ secrets.CF_ACCESS_READBACK_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          readback="$RUNNER_TEMP/work-test-production-readback.glb"

          curl --silent --show-error --fail \
            --connect-timeout 10 \
            --max-time 60 \
            --header "CF-Access-Client-Id: $CF_ACCESS_READBACK_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $CF_ACCESS_READBACK_CLIENT_SECRET" \
            --output "$readback" \
            "$GLB_URL"

          readback_size="$(stat -c '%s' "$readback")"
          readback_sha="$(sha256sum "$readback" | awk '{print $1}')"
          [[ "$readback_size" == "$EXPECTED_SIZE" ]] || { echo "Production GLB size mismatch" >&2; exit 1; }
          [[ "$readback_sha" == "$EXPECTED_SHA256" ]] || { echo "Production GLB SHA-256 mismatch" >&2; exit 1; }
          echo "Production byte-for-byte readback verified."

      - name: Remove private temporary files
        if: always()
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/work-test-source.glb" \
            "$RUNNER_TEMP/work-test-production-readback.glb" \
            "$RUNNER_TEMP/publish-response.json" \
            "$RUNNER_TEMP/catalog.json"
