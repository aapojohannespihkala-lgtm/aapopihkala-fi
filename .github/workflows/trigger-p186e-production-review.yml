name: Trigger P186E production review

on:
  push:
    branches: [ops/private-model-review]
    paths: [.github/private-model-review-request.json]

permissions:
  contents: read
  actions: write

concurrency:
  group: trigger-p186e-production-review
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ops/private-model-review' && github.repository == 'aapojohannespihkala-lgtm/aapopihkala-fi'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Execute the validator from protected main, never from the request branch.
      - name: Checkout trusted main and request history
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Validate owner event and complete request-only tree
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF_FULL: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: python3 .github/scripts/private-model-review-dispatch.py "$RUNNER_TEMP/p186e-review-dispatch.json"
      - name: Dispatch existing read-only production probe on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST
          "/repos/${GITHUB_REPOSITORY}/actions/workflows/private-model-production-review-smoke.yml/dispatches"
          --input "$RUNNER_TEMP/p186e-review-dispatch.json"
